models:
- name: GOLD__TEH_SUPPORT_SERVICES__DETAILED_HD_TGIS_MERGED_REPORT
  description: |
    PURPOSE: Merged view of IT helpdesk cases and TGIS service requests providing unified case tracking with status, assignment, and resolution details.
    GRAIN: One row per helpdesk case or TGIS service request.
    KEY LOGIC: Joins ITHD cases with TGIS records on case number; combines status, urgency, and timeline fields from both systems.
    CAVEAT: Cases without a TGIS counterpart show None in TGIS fields.
  tests:
  - has_data
  - recently_run
  columns:
  - name: _AUDIT_LOG_ID
  - name: _ROW_HASH
  - name: CASE_NUMBER
    description: "Business attribute for case number in the support services domain. Text or coded value. Null when not populated in the source system."
  - name: TGIS_ID
    description: "Case or service request identifier linking to the source ticketing system. Alphanumeric key. Null when no linked case exists."
  - name: TITLE_EN
    description: "Free-text title en field from the ticketing system. May contain multi-line text. Null when not entered by the user."
  - name: DESCRIPTION_EN
    description: "Free-text description en field from the ticketing system. May contain multi-line text. Null when not entered by the user."
  - name: ITHD_URGENCY
    description: "Priority classification for the case (e.g. 1-Critical, 2-High, 3-Normal). Text or numeric code. Null for cases created without priority."
  - name: ITHD_STATUS
    description: "Current status label for the record. Text value (e.g. Active, Resolved, Closed). Null for records not yet processed."
  - name: TGIS_STATUS
    description: "Current status label for the record. Text value (e.g. Active, Resolved, Closed). Null for records not yet processed."
  - name: ISSUER
    description: "Boolean indicator for issuer. Y/N or True/False. Defaults to N/False when not explicitly set."
  - name: FUNCTIONAL_TEAM
    description: "Assignment group or queue for functional team. Text label. Null when not assigned to a group."
  - name: ITHD_ISSUE_DATE
    description: "Timestamp recording when the ithd issue date event occurred. ISO datetime or date value. Null when the event has not taken place."
  - name: WORKED_BY_ITHD
    description: "Person who performed the action for worked by ithd. Employee name or login. Null when action was system-initiated."
  - name: L2_GROUP_TGIS
    description: "Assignment group or queue for l2 group tgis. Text label. Null when not assigned to a group."
  - name: PROGRESS_UPDATE
    description: "Business attribute for progress update in the support services domain. Text or coded value. Null when not populated in the source system."
  - name: TGIS_ISSUE_DATE
    description: "Timestamp recording when the tgis issue date event occurred. ISO datetime or date value. Null when the event has not taken place."
  - name: QUEUE
    description: "Assignment group or queue for queue. Text label. Null when not assigned to a group."
  - name: REQUESTOR_CASE_TYPE
    description: "Business attribute for requestor case type in the support services domain. Text or coded value. Null when not populated in the source system."
  - name: REQUESTOR_CASE_SUB_TYPE
    description: "Business attribute for requestor case sub type in the support services domain. Text or coded value. Null when not populated in the source system."
  - name: SYSTEM_NAME
    description: "Descriptive name or label for system name. Free-text string. Null when the name has not been maintained."
  - name: RESOLVED_ON
    description: "Timestamp recording when the resolved on event occurred. ISO datetime or date value. Null when the event has not taken place."
  - name: ITHD_ETA
    description: "Estimated completion date for ithd eta. Date or datetime value. Null when no estimate has been provided."
  - name: TGIS_ETA
    description: "Estimated completion date for tgis eta. Date or datetime value. Null when no estimate has been provided."
  - name: ETA_MATCH_FLAG
    description: "Boolean indicator for eta match flag. Y/N or True/False. Defaults to N/False when not explicitly set."
  - name: LATEST_TIMELINE_EN
    description: "Business attribute for latest timeline en in the support services domain. Text or coded value. Null when not populated in the source system."
  - name: UPDATED_ON
