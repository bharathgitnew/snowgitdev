- name: GOLD__TEH_SUPPORT_SERVICES__HELPDESK_METRICS_DYN
  description: |
    PURPOSE: Monthly aggregated helpdesk KPI metrics showing ticket volume trends for opened, resolved, and backlog counts.
    GRAIN: One row per year-month period.
    KEY LOGIC: Aggregates case counts by month from the helpdesk case detail tables.
    CAVEAT: Current month may show null for resolved/backlog until month-end processing completes.
  tests:
  - has_data
  - recently_run
  columns:
  - name: _AUDIT_LOG_ID
  - name: _ROW_HASH
  - name: YEAR_MONTH
    description: "Reporting period in YYYY-MM format. Text string. Always populated as the aggregation key."
  - name: TICKETS_OPENED
    description: "Monthly count of tickets opened. Integer. Null for the current month if not yet calculated."
  - name: TICKETS_RESOLVED
    description: "Monthly count of tickets resolved. Integer. Null for the current month if not yet calculated."
  - name: TICKETS_BACKLOG
    description: "Monthly count of tickets backlog. Integer. Null for the current month if not yet calculated."
