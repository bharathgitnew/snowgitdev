- name: GOLD__TEH_SUPPORT_SERVICES__TGIS_STATUS
  description: |
    PURPOSE: TGIS (TEL Global IT Services) workflow status tracker showing step-by-step progress for service requests.
    GRAIN: One row per TGIS service request.
    KEY LOGIC: Tracks current step, total steps, completion progress, and latest comment for each TGIS case.
    CAVEAT: Completed cases show progress as total/total (e.g. 10/10); in-progress cases show partial completion.
  tests:
  - has_data
  - recently_run
  columns:
  - name: _AUDIT_LOG_ID
  - name: _ROW_HASH
  - name: ID
    description: "Business attribute for id in the support services domain. Text or coded value. Null when not populated in the source system."
  - name: IT_HELPDESK_ID
    description: "Case or service request identifier linking to the source ticketing system. Alphanumeric key. Null when no linked case exists."
  - name: CURRENT_STEP
    description: "Workflow step indicator for current step. Integer or text. Null when workflow has not started."
  - name: COMPLETED_STEP_NUMBER
    description: "Workflow step indicator for completed step number. Integer or text. Null when workflow has not started."
  - name: TOTAL_STEPS
    description: "Numeric count of total steps. Integer. Zero when no items exist."
  - name: TITLE
    description: "Free-text title field from the ticketing system. May contain multi-line text. Null when not entered by the user."
  - name: COMPLETED_STEP_NAME
    description: "Descriptive name or label for completed step name. Free-text string. Null when the name has not been maintained."
  - name: CURRENT_STEP_NAME
    description: "Descriptive name or label for current step name. Free-text string. Null when the name has not been maintained."
  - name: NEXT_STEP_NAME
    description: "Descriptive name or label for next step name. Free-text string. Null when the name has not been maintained."
  - name: STATUS
    description: "Current status label for the record. Text value (e.g. Active, Resolved, Closed). Null for records not yet processed."
  - name: RELATED_CASES
    description: "Business attribute for related cases in the support services domain. Text or coded value. Null when not populated in the source system."
  - name: LAST_UPDATED_DATETIME
    description: "Timestamp recording when the last updated datetime event occurred. ISO datetime or date value. Null when the event has not taken place."
  - name: PROGRESS
    description: "Step completion ratio displayed as completed/total (e.g. 7/10). Text fraction. Shows total/total when fully complete."
  - name: WORKINCHARGE
    description: "Person who performed the action for workincharge. Employee name or login. Null when action was system-initiated."
  - name: LATEST_COMMENT
    description: "Free-text latest comment field from the ticketing system. May contain multi-line text. Null when not entered by the user."
  - name: LATEST_COMMENT_UPDATE_BY
    description: "Free-text latest comment update by field from the ticketing system. May contain multi-line text. Null when not entered by the user."
  - name: LATEST_COMMENT_UPDATE_DATETIME
    description: "Timestamp recording when the latest comment update datetime event occurred. ISO datetime or date value. Null when the event has not taken place."
  - name: ISSUE_DATE
    description: "Timestamp recording when the issue date event occurred. ISO datetime or date value. Null when the event has not taken place."
