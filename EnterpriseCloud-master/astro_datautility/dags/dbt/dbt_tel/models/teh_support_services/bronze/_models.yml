models:
  - name: BRONZE__TEH_SUPPORT_SERVICES__FILE_FST_EMPLOYEE_GROUP
    description: |
      PURPOSE: Raw ingestion of field service technician employee group assignments linking supervisors, employees, and regional service managers.
      GRAIN: One row per employee-supervisor-region assignment as of the source file extraction date.
    tests:
      - has_data
      - recently_run
    columns:
      - name: _FILENAME
      - name: _FILEDATE
      - name: _UPLOADDATE
      - name: FSTSUPERVISORID
        description: "Unique identifier for the field service technician supervisor in the source workforce system. Used to establish the reporting hierarchy for technician groups. Joins to employee master data for supervisor details."
      - name: FSTSUPERVISORNAME
        description: "Display name of the field service technician supervisor from the source system. Denormalized for direct reporting without lookup joins. Represents the direct manager of the employee group."
      - name: FSTEMPLOYEEGROUP
        description: "Name or code identifying the field service technician employee group assignment. Groups technicians under a common supervisor for scheduling and dispatch. Used for workforce segmentation and capacity planning."
      - name: REGIONALSERVICEMANAGERID
        description: "Unique identifier for the regional service manager overseeing this employee group. Establishes the second-level management hierarchy above the direct supervisor. Joins to employee master data for RSM details."
      - name: RSMFLAG
        description: "Boolean or coded indicator marking whether this row represents a regional service manager entry. Distinguishes RSM records from regular technician group assignments. Used for filtering hierarchy levels in reporting."
      - name: REGIONALSERVICEMANAGER
        description: "Display name of the regional service manager overseeing this employee group. Denormalized for direct reporting without lookup joins. Represents the senior management tier above supervisors."
      - name: FILEDATE
        description: "Business date associated with the source file extraction representing the data-as-of date. Reflects when the employee group assignment snapshot was captured. Formatted as a date value without time component."
      - name: AUDIT_LOG_ID
        description: "Surrogate key generated by the ingestion pipeline to uniquely track each record load event. Links to the audit logging framework for data lineage tracing. Integer value auto-incremented per load batch."
      - name: _ROW_HASH
  - name: BRONZE__TEH_SUPPORT_SERVICES__ITHD_CONTACT
    description: |
      PURPOSE: Raw ingestion of contact records from the IT Help Desk Dynamics 365 CRM capturing employee and customer contact information.
      GRAIN: One row per contact entity identified by the CRM system-generated GUID.
    tests:
      - has_data
      - recently_run
    columns:
      - name: _FILEDATE
      - name: _FILENAME
      - name: _UPLOADDATE
      - name: AUDIT_LOG_ID
        description: "Surrogate key generated by the ingestion pipeline to uniquely track each record load event. Links to the audit logging framework for data lineage tracing. Integer value auto-incremented per load batch."
      - name: _ROW_HASH
      - name: ID
        description: "Dynamics 365 system-generated GUID serving as the primary key for this entity record. Formatted as a 36-character hyphenated string. Uniquely identifies this row across the entire CRM instance."
      - name: SINKCREATEDON
        description: "Timestamp when this record was first written to the data lake sink during extraction. Reflects pipeline processing time rather than source system creation. Used to track data landing freshness."
      - name: SINKMODIFIEDON
        description: "Timestamp when this record was last updated in the data lake sink layer. Reflects the most recent pipeline extraction that touched this record. Used for incremental processing watermarks."
      - name: STATECODE
        description: "Dynamics 365 entity state code indicating whether the record is active or inactive. Integer option set value where 0 typically means Active and 1 means Inactive. Controls record visibility in standard CRM views."
      - name: STATUSCODE
        description: "Dynamics 365 status reason code providing granular status within the parent state. Integer option set value dependent on the STATECODE value. Defines the specific lifecycle stage of the record."
      - name: ACCOUNTROLECODE
        description: "Option set integer defining this contact role relative to their parent account. Values distinguish between decision maker, employee, influencer, or other roles. Used for relationship classification in account-based reporting."
      - name: ADDRESS1_ADDRESSTYPECODE
        description: "Option set integer classifying the primary address purpose such as bill-to, ship-to, or primary. Categorizes how the address is used in business processes. Standard Dynamics 365 address type enumeration."
      - name: ADDRESS1_FREIGHTTERMSCODE
        description: "Option set integer specifying the freight terms for the primary address. Maps to shipping responsibility agreements like FOB origin or destination. Used in logistics and order fulfillment processes."
      - name: ADDRESS1_SHIPPINGMETHODCODE
        description: "Option set integer indicating the preferred shipping method for the primary address. Maps to carrier or delivery options configured in the organization. Used for logistics and delivery preference tracking."
      - name: ADDRESS2_ADDRESSTYPECODE
        description: "Option set integer classifying the secondary address purpose such as bill-to, ship-to, or other. Categorizes how the alternate address is used in business processes. Standard Dynamics 365 address type enumeration."
      - name: ADDRESS2_FREIGHTTERMSCODE
        description: "Option set integer specifying the freight terms for the secondary address. Maps to shipping responsibility agreements like FOB origin or destination. Used in logistics and order fulfillment processes."
      - name: ADDRESS2_SHIPPINGMETHODCODE
        description: "Option set integer indicating the preferred shipping method for the secondary address. Maps to carrier or delivery options configured in the organization. Used for logistics and delivery preference tracking."
      - name: ADDRESS3_ADDRESSTYPECODE
        description: "Option set integer classifying the tertiary address purpose such as bill-to, ship-to, or other. Categorizes how the third address is used in business processes. Standard Dynamics 365 address type enumeration."
      - name: ADDRESS3_FREIGHTTERMSCODE
        description: "Option set integer specifying the freight terms for the tertiary address. Maps to shipping responsibility agreements like FOB origin or destination. Used in logistics and order fulfillment processes."
      - name: ADDRESS3_SHIPPINGMETHODCODE
        description: "Option set integer indicating the preferred shipping method for the tertiary address. Maps to carrier or delivery options configured in the organization. Used for logistics and delivery preference tracking."
      - name: CUSTOMERSIZECODE
        description: "Option set integer classifying the contact organization by employee count or revenue band. Used for market segmentation and targeting in sales workflows. Values map to small, medium, large, or enterprise tiers."
      - name: CUSTOMERTYPECODE
        description: "Option set integer classifying the type of customer this contact represents. Distinguishes between prospect, customer, partner, vendor, or other relationship types. Used for segmentation and campaign targeting."
      - name: EDUCATIONCODE
        description: "Option set integer representing the highest education level attained by this contact. Values map to standard education categories from high school through doctorate. Used for demographic profiling and communication targeting."
      - name: FAMILYSTATUSCODE
        description: "Option set integer representing the marital or family status of this contact. Values map to single, married, divorced, or widowed categories. Used for demographic profiling and benefit eligibility."
      - name: GENDERCODE
        description: "Option set integer representing the gender of this contact. Standard Dynamics 365 gender enumeration for demographic classification. Used for personalization and demographic reporting."
      - name: HASCHILDRENCODE
        description: "Option set integer indicating whether this contact has children. Binary enumeration for demographic classification and household profiling. Used in family-oriented marketing segmentation."
      - name: LEADSOURCECODE
        description: "Option set integer identifying the original marketing source that generated this contact as a lead. Maps to channels like web, referral, event, or advertising. Used for marketing attribution and ROI analysis."
      - name: MCA_CASEEMAILNOTIFICATION
        description: "Option set integer controlling the email notification preference for case updates on this contact. Determines whether and how frequently the contact receives case status emails. Organization-specific configuration for support communication."
      - name: MCA_EMPLOYEETYPE
        description: "Option set integer classifying the employment type of this contact within the organization. Distinguishes between full-time, part-time, contractor, or vendor categories. Used for access provisioning and service entitlement."
      - name: MCA_PREFERREDCONTACT
        description: "Option set integer indicating this contact preferred communication channel. Maps to email, phone, portal, or other contact methods. Used for case communication routing decisions."
      - name: MSDYN_DECISIONINFLUENCETAG
        description: "Option set integer tagging this contact decision-making influence level in purchasing processes. Classifies influence as decision maker, influencer, blocker, or champion. Used for sales strategy and stakeholder mapping."
      - name: MSDYN_ORGCHANGESTATUS
        description: "Option set integer tracking organizational change status for this contact record. Indicates whether the contact has pending, completed, or no organizational changes. Used for change management and data quality tracking."
      - name: MSPP_USERPREFERREDLCID
        description: "Option set integer specifying the preferred locale identifier for this contact portal experience. Maps to a Windows LCID code determining language and regional format. Used for portal content localization."
      - name: PAYMENTTERMSCODE
        description: "Option set integer defining the default payment terms for transactions with this contact. Maps to net-30, net-60, due-on-receipt, or other payment schedules. Used in accounts receivable and invoicing workflows."
      - name: PREFERREDAPPOINTMENTDAYCODE
        description: "Option set integer indicating this contact preferred day of the week for appointments. Maps to Monday through Sunday enumeration for scheduling optimization. Used by service scheduling algorithms."
      - name: PREFERREDAPPOINTMENTTIMECODE
        description: "Option set integer indicating this contact preferred time of day for appointments. Maps to morning, afternoon, or evening preferences. Used by service scheduling algorithms for optimal slot selection."
      - name: PREFERREDCONTACTMETHODCODE
        description: "Option set integer indicating the overall preferred method of contact. Maps to phone, email, fax, mail, or any method. Used for communication routing and compliance with contact preferences."
      - name: SHIPPINGMETHODCODE
        description: "Option set integer indicating the default shipping method preferred by this contact. Maps to carrier or delivery options configured in the organization. Used as the default for order fulfillment."
      - name: TERRITORYCODE
        description: "Option set integer classifying the geographic or logical territory this contact belongs to. Maps to organizational territory definitions for routing and assignment. Used for regional segmentation and workload distribution."
      - name: ADX_CONFIRMREMOVEPASSWORD
        description: "Boolean flag indicating whether the contact has confirmed removal of their portal password. Used in portal identity management for password-to-external-auth migration. Set during account security transitions."
      - name: ADX_IDENTITY_EMAILADDRESS1CONFIRMED
        description: "Boolean flag indicating whether the contact primary email address has been verified via the portal. Required for email-based authentication and notification delivery. Set after the contact clicks a confirmation link."
      - name: ADX_IDENTITY_LOCALLOGINDISABLED
        description: "Boolean flag indicating whether local username/password authentication is disabled for this portal contact. Forces the use of external identity providers when true. Used for security hardening of portal access."
      - name: ADX_IDENTITY_LOCKOUTENABLED
        description: "Boolean flag indicating whether account lockout protection is enabled for this portal contact. When true, repeated failed login attempts trigger temporary account lockout. Part of the portal brute-force protection mechanism."
      - name: ADX_IDENTITY_LOGONENABLED
        description: "Boolean flag indicating whether this portal contact account is enabled for authentication. Set to false to prevent login while preserving the account record. Master switch for portal access."
      - name: ADX_IDENTITY_MOBILEPHONECONFIRMED
        description: "Boolean flag indicating whether this contact mobile phone has been verified for two-factor authentication. Required for SMS-based multi-factor authentication flows. Set after successful verification code entry."
      - name: ADX_IDENTITY_TWOFACTORENABLED
        description: "Boolean flag indicating whether two-factor authentication is enabled for this portal contact. Requires a second verification factor beyond password at login. Part of the portal security configuration."
      - name: ADX_PROFILEALERT
        description: "Boolean flag indicating whether an administrative alert exists on this contact portal profile. Used to flag accounts requiring review or action by portal administrators. Cleared after the alert is addressed."
      - name: ADX_PROFILEISANONYMOUS
        description: "Boolean flag indicating whether this contact portal profile represents an anonymous or guest session. Distinguishes between authenticated and unauthenticated portal visitors. Used for access control and analytics segmentation."
      - name: CREDITONHOLD
        description: "Boolean flag indicating whether this contact account has been placed on credit hold. Prevents new orders or transactions from being processed when true. Set by accounts receivable management."
      - name: DONOTBULKEMAIL
        description: "Boolean flag indicating the contact has opted out of bulk email marketing communications. Enforced by the marketing automation module to exclude from mass campaigns. Set via preference center or administrative action."
      - name: DONOTBULKPOSTALMAIL
        description: "Boolean flag indicating the contact has opted out of bulk postal mail marketing. Enforced by direct mail campaign lists to exclude from physical mailings. Set via preference center or administrative action."
      - name: DONOTEMAIL
        description: "Boolean flag indicating the contact has opted out of all email communications from the CRM. Suppresses both marketing and transactional email when true. Set via preference center or administrative action."
      - name: DONOTFAX
        description: "Boolean flag indicating the contact has opted out of fax communications. Suppresses fax activity creation and delivery for this contact. Set via preference center or administrative action."
      - name: DONOTPHONE
        description: "Boolean flag indicating the contact has opted out of telephone communications. Suppresses phone call activity creation and telemarketing for this contact. Set via preference center or administrative action."
      - name: DONOTPOSTALMAIL
        description: "Boolean flag indicating the contact has opted out of postal mail communications. Suppresses physical mail generation and label creation for this contact. Set via preference center or administrative action."
      - name: DONOTSENDMM
        description: "Boolean flag indicating the contact should not receive marketing materials of any type. Master opt-out flag that overrides channel-specific preferences. Set via preference center or administrative action."
      - name: FOLLOWEMAIL
        description: "Boolean flag indicating whether email engagement tracking is enabled for this contact. Controls whether opened and clicked email metrics are collected. Used for sales engagement analytics."
      - name: ISAUTOCREATE
        description: "Boolean flag indicating whether this contact record was automatically created by the system. True for contacts generated from email tracking or portal registration. Distinguishes from manually entered contacts."
      - name: ISBACKOFFICECUSTOMER
        description: "Boolean flag indicating whether this contact is classified as a back-office or internal customer. Distinguishes between external customers and internal service consumers. Used for reporting segmentation."
      - name: ISPRIVATE
        description: "Boolean flag indicating whether this contact record has restricted visibility to the owner only. Limits access beyond standard role-based security when true. Used for sensitive relationship records."
      - name: MARKETINGONLY
        description: "Boolean flag indicating this contact exists solely for marketing purposes without a service relationship. Prevents inclusion in service-level reporting and entitlement calculations. Used for list segmentation."
      - name: MERGED
        description: "Boolean flag indicating this contact record has been merged into another master record. Merged records are deactivated with a pointer to the surviving record. Used for data quality deduplication tracking."
      - name: MSDYN_DISABLEWEBTRACKING
        description: "Boolean flag indicating whether web behavior tracking is disabled for this contact. Suppresses website visit and click tracking when true. Used for privacy preference enforcement."
      - name: MSDYN_GDPROPTOUT
        description: "Boolean flag indicating this contact has exercised GDPR right to opt out of data processing. Suppresses certain analytics and automated processing when true. Used for EU privacy regulation compliance."
      - name: MSDYN_ISASSISTANTINORGCHART
        description: "Boolean flag indicating whether this contact functions as an assistant in the organizational chart view. Controls display positioning in org chart visualizations. Used for relationship hierarchy rendering."
      - name: MSDYN_ISMINOR
        description: "Boolean flag indicating this contact is classified as a minor requiring parental consent protections. Triggers additional privacy safeguards and processing restrictions. Used for child data protection compliance."
      - name: MSDYN_ISMINORWITHPARENTALCONSENT
        description: "Boolean flag indicating this minor contact has received verified parental consent for data processing. Allows processing that would otherwise be restricted for minor contacts. Used for COPPA and similar compliance."
      - name: PARTICIPATESINWORKFLOW
        description: "Boolean flag indicating whether this contact record is eligible to participate in automated workflow rules. Controls whether system workflows can trigger actions on this record. Used for workflow scope management."
      - name: ACCOUNTID
        description: "GUID referencing the parent account entity this contact is associated with in the CRM. Establishes the company-to-person relationship for B2B scenarios. Joins to the account entity for organization details."
      - name: ACCOUNTID_ENTITYTYPE
        description: "Logical entity name of the ACCOUNTID lookup target, always resolves to account. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently account for this field."
      - name: ADX_PREFERREDLANGUAGEID
        description: "GUID referencing the language entity for this contact preferred portal language. Controls the default language for portal content display and communications. Joins to the portal language configuration entity."
      - name: ADX_PREFERREDLANGUAGEID_ENTITYTYPE
        description: "Logical entity name of the ADX_PREFERREDLANGUAGEID lookup target. Included by the Dataverse export framework for polymorphic lookup support. Resolves to the portal language entity."
      - name: CREATEDBY
        description: "GUID referencing the systemuser who originally created this record in Dynamics 365. Stored as a 36-character lookup identifier. Joins to the systemuser entity for user attribution."
      - name: CREATEDBY_ENTITYTYPE
        description: "Logical entity name of the CREATEDBY lookup target, always resolves to systemuser. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently systemuser for this field."
      - name: CREATEDBYEXTERNALPARTY
        description: "GUID referencing the external party entity that created this contact via portal self-registration. Populated for contacts originating from external-facing channels. Null for internally created contacts."
      - name: CREATEDBYEXTERNALPARTY_ENTITYTYPE
        description: "Logical entity name of the CREATEDBYEXTERNALPARTY lookup target. Included by the Dataverse export framework for polymorphic lookup support. Resolves to the external party entity."
      - name: CREATEDONBEHALFBY
        description: "GUID referencing the systemuser on whose behalf this record was originally created via delegation. Populated when an admin or automated process creates records for another user. Null when no delegation was involved in creation."
      - name: CREATEDONBEHALFBY_ENTITYTYPE
        description: "Logical entity name of the CREATEDONBEHALFBY lookup target, always resolves to systemuser. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently systemuser for this field."
      - name: DEFAULTPRICELEVELID
        description: "GUID referencing the default price list entity for transactions involving this contact. Determines which pricing tier applies to orders and quotes. Joins to the pricelevel entity."
      - name: DEFAULTPRICELEVELID_ENTITYTYPE
        description: "Logical entity name of the DEFAULTPRICELEVELID lookup target, resolves to pricelevel. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently pricelevel for this field."
      - name: MASTERID
        description: "GUID referencing the master contact record when this record has been merged into a survivor. Points to the canonical contact after deduplication merge. Null for non-merged records."
      - name: MASTERID_ENTITYTYPE
        description: "Logical entity name of the MASTERID lookup target, always resolves to contact. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently contact for this field."
      - name: MCA_LOCATION
        description: "GUID lookup referencing the location entity associated with this contact physical work site. Links the contact to an office or facility for geographic reporting. Joins to the mca_location reference entity."
      - name: MCA_LOCATION_ENTITYTYPE
        description: "Logical entity name of the MCA_LOCATION lookup target, resolves to the location entity. Included by the Dataverse export framework for polymorphic lookup support. Resolves to the custom location entity."
      - name: MCA_MANAGER
        description: "GUID lookup referencing the contact entity record representing this contact direct manager. Establishes reporting hierarchy within the CRM contact structure. Joins to the contact entity for manager details."
      - name: MCA_MANAGER_ENTITYTYPE
        description: "Logical entity name of the MCA_MANAGER lookup target, resolves to contact. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently contact for this field."
      - name: MCA_REGION
        description: "GUID lookup referencing the geographic region entity associated with this contact. Establishes which regional service area this contact belongs to. Joins to the mca_region entity for territorial segmentation."
      - name: MCA_REGION_ENTITYTYPE
        description: "Logical entity name of the MCA_REGION lookup target, resolves to the region entity. Included by the Dataverse export framework for polymorphic lookup support. Resolves to the custom region entity."
      - name: MCA_SUBSIDIARY
        description: "GUID lookup referencing the subsidiary entity this contact is affiliated with organizationally. Establishes the legal entity relationship for multi-company environments. Joins to the mca_subsidiary reference entity."
      - name: MCA_SUBSIDIARY_ENTITYTYPE
        description: "Logical entity name of the MCA_SUBSIDIARY lookup target. Included by the Dataverse export framework for polymorphic lookup support. Resolves to the subsidiary reference entity."
      - name: MODIFIEDBY
        description: "GUID referencing the systemuser who last modified this record in Dynamics 365. Stored as a 36-character lookup identifier. Joins to the systemuser entity for change attribution."
      - name: MODIFIEDBY_ENTITYTYPE
        description: "Logical entity name of the MODIFIEDBY lookup target, always resolves to systemuser. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently systemuser for this field."
      - name: MODIFIEDBYEXTERNALPARTY
        description: "GUID referencing the external party entity that last modified this contact via a portal or external channel. Populated for modifications originating from external-facing systems. Null for internally modified records."
      - name: MODIFIEDBYEXTERNALPARTY_ENTITYTYPE
        description: "Logical entity name of the MODIFIEDBYEXTERNALPARTY lookup target. Included by the Dataverse export framework for polymorphic lookup support. Resolves to the external party entity."
      - name: MODIFIEDONBEHALFBY
        description: "GUID referencing the systemuser on whose behalf the last modification was performed via delegation. Populated when a user acts as a delegate for another user. Null when no delegation was involved."
      - name: MODIFIEDONBEHALFBY_ENTITYTYPE
        description: "Logical entity name of the MODIFIEDONBEHALFBY lookup target, always resolves to systemuser. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently systemuser for this field."
      - name: MSA_MANAGINGPARTNERID
        description: "GUID referencing the account entity representing the managing partner organization for this contact. Used in partner relationship management scenarios for channel sales. Joins to the account entity."
      - name: MSA_MANAGINGPARTNERID_ENTITYTYPE
        description: "Logical entity name of the MSA_MANAGINGPARTNERID lookup target, resolves to account. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently account for this field."
      - name: MSDYN_CONTACTKPIID
        description: "GUID referencing the contact KPI record tracking engagement metrics for this contact. Links to computed KPI scores from marketing and sales interactions. Joins to the contact KPI entity."
      - name: MSDYN_CONTACTKPIID_ENTITYTYPE
        description: "Logical entity name of the MSDYN_CONTACTKPIID lookup target. Included by the Dataverse export framework for polymorphic lookup support. Resolves to the contact KPI entity."
      - name: MSDYN_SEGMENTID
        description: "GUID referencing the marketing segment entity this contact currently belongs to. Reflects dynamic or static segment membership from the marketing module. Joins to the segment entity."
      - name: MSDYN_SEGMENTID_ENTITYTYPE
        description: "Logical entity name of the MSDYN_SEGMENTID lookup target. Included by the Dataverse export framework for polymorphic lookup support. Resolves to the segment entity."
      - name: ORIGINATINGLEADID
        description: "GUID referencing the lead entity that was qualified and converted to create this contact. Establishes the provenance chain from marketing lead to contact record. Null for contacts not originating from lead conversion."
      - name: ORIGINATINGLEADID_ENTITYTYPE
        description: "Logical entity name of the ORIGINATINGLEADID lookup target, resolves to lead. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently lead for this field."
      - name: OWNINGBUSINESSUNIT
        description: "GUID of the business unit that owns this record through the ownership hierarchy. Derived from the owning user or team business unit membership. Used for organizational security boundary enforcement."
      - name: OWNINGBUSINESSUNIT_ENTITYTYPE
        description: "Logical entity name of the OWNINGBUSINESSUNIT lookup target, always resolves to businessunit. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently businessunit for this field."
      - name: OWNINGTEAM
        description: "GUID of the team that owns this record when ownership is team-based. Null when the record is owned by an individual user. Used for team-level security and assignment routing."
      - name: OWNINGTEAM_ENTITYTYPE
        description: "Logical entity name of the OWNINGTEAM lookup target, always resolves to team. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently team for this field."
      - name: OWNINGUSER
        description: "GUID of the systemuser who individually owns this record when ownership is user-based. Null when the record is owned by a team rather than an individual. Used for user-level security scoping."
      - name: OWNINGUSER_ENTITYTYPE
        description: "Logical entity name of the OWNINGUSER lookup target, always resolves to systemuser. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently systemuser for this field."
      - name: PARENTCONTACTID
        description: "GUID referencing another contact entity serving as the parent in a hierarchical relationship. Used for representing personal reporting chains or familial relationships. Joins to the contact entity."
      - name: PARENTCONTACTID_ENTITYTYPE
        description: "Logical entity name of the PARENTCONTACTID lookup target, always resolves to contact. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently contact for this field."
      - name: PREFERREDEQUIPMENTID
        description: "GUID referencing the equipment or facility entity preferred by this contact for service appointments. Used by the service scheduling engine for resource preference matching. Joins to the equipment entity."
      - name: PREFERREDEQUIPMENTID_ENTITYTYPE
        description: "Logical entity name of the PREFERREDEQUIPMENTID lookup target, resolves to equipment. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently equipment for this field."
      - name: PREFERREDSERVICEID
        description: "GUID referencing the service entity preferred by this contact for scheduling. Used by the service scheduling engine for service type preference matching. Joins to the service entity."
      - name: PREFERREDSERVICEID_ENTITYTYPE
        description: "Logical entity name of the PREFERREDSERVICEID lookup target, resolves to service. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently service for this field."
      - name: PREFERREDSYSTEMUSERID
        description: "GUID referencing the systemuser preferred by this contact for service interactions. Routes service activities to the preferred agent when available. Joins to the systemuser entity."
      - name: PREFERREDSYSTEMUSERID_ENTITYTYPE
        description: "Logical entity name of the PREFERREDSYSTEMUSERID lookup target, resolves to systemuser. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently systemuser for this field."
      - name: SLAID
        description: "GUID referencing the SLA entity applied to this contact for service level enforcement. Determines which response and resolution time targets apply. Joins to the SLA configuration entity."
      - name: SLAID_ENTITYTYPE
        description: "Logical entity name of the SLAID lookup target, always resolves to sla. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently sla for this field."
      - name: SLAINVOKEDID
        description: "GUID referencing the specific SLA entity instance that was most recently invoked on this contact. Tracks which SLA version was active at the time of invocation. Joins to the SLA entity for details."
      - name: SLAINVOKEDID_ENTITYTYPE
        description: "Logical entity name of the SLAINVOKEDID lookup target, resolves to sla. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently sla for this field."
      - name: TRANSACTIONCURRENCYID
        description: "GUID referencing the currency entity used for monetary fields on this record. Determines which exchange rate applies for base currency conversion. Joins to the transactioncurrency entity."
      - name: TRANSACTIONCURRENCYID_ENTITYTYPE
        description: "Logical entity name of the TRANSACTIONCURRENCYID lookup target, always resolves to transactioncurrency. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently transactioncurrency for this field."
      - name: OWNERID
        description: "GUID of the principal (user or team) that owns this record in Dynamics 365. Polymorphic lookup that can reference either systemuser or team entity. Determines row-level security access."
      - name: OWNERID_ENTITYTYPE
        description: "Logical entity name indicating whether the OWNERID references a systemuser or team. Resolves the polymorphic ownership lookup to the correct target entity. Used for proper join resolution in downstream models."
      - name: PARENTCUSTOMERID
        description: "GUID polymorphic lookup referencing the parent customer which may be an account or contact entity. Establishes the primary customer relationship for this contact. Used for hierarchical customer modeling."
      - name: PARENTCUSTOMERID_ENTITYTYPE
        description: "Logical entity name indicating whether PARENTCUSTOMERID references an account or contact. Resolves the polymorphic lookup to the correct target entity type. Used for proper join resolution."
      - name: AGING30
        description: "Monetary amount of receivables aging in the 0-30 day bucket for this contact in transaction currency. Calculated from open invoice balances in the financial subsystem. Used for credit risk assessment."
      - name: AGING30_BASE
        description: "Base currency equivalent of the 0-30 day aging amount after exchange rate conversion. Normalized to the organization base currency for consolidated reporting. Derived from AGING30 multiplied by EXCHANGERATE."
      - name: AGING60
        description: "Monetary amount of receivables aging in the 31-60 day bucket for this contact in transaction currency. Calculated from open invoice balances in the financial subsystem. Used for credit risk assessment."
      - name: AGING60_BASE
        description: "Base currency equivalent of the 31-60 day aging amount after exchange rate conversion. Normalized to the organization base currency for consolidated reporting. Derived from AGING60 multiplied by EXCHANGERATE."
      - name: AGING90
        description: "Monetary amount of receivables aging in the 61-90 day bucket for this contact in transaction currency. Calculated from open invoice balances in the financial subsystem. Used for credit risk assessment."
      - name: AGING90_BASE
        description: "Base currency equivalent of the 61-90 day aging amount after exchange rate conversion. Normalized to the organization base currency for consolidated reporting. Derived from AGING90 multiplied by EXCHANGERATE."
      - name: ANNUALINCOME
        description: "Annual income of this contact in transaction currency as reported or estimated. Used for customer profiling and credit assessment in sales workflows. Decimal value entered manually or via integration."
      - name: ANNUALINCOME_BASE
        description: "Base currency equivalent of the annual income after exchange rate conversion. Normalized to the organization base currency for consolidated reporting. Derived from ANNUALINCOME multiplied by EXCHANGERATE."
