  - name: BRONZE__TEH_SUPPORT_SERVICES__SHAREPOINT_ORACLE_DEPARTMENT
    description: |
      PURPOSE: Raw ingestion of department cross-reference data mapping Oracle ERP department codes to SAP equivalents from a SharePoint master list.
      GRAIN: One row per Oracle department code with its corresponding SAP mapping.
    tests:
      - has_data
      - recently_run
    columns:
      - name: _FILENAME
      - name: _FILEDATE
      - name: AUDIT_LOG_ID
        description: "Identifier linking this record to the dbt invocation audit log entry. Tracks which pipeline run ingested or updated this record. Used for data lineage and troubleshooting pipeline issues."
      - name: _ROW_HASH
      - name: ORACLE_CODE
        description: "Department code from the legacy Oracle ERP system. Serves as the primary identifier for departments in Oracle-based processes. Used for cross-referencing between Oracle and SAP systems."
      - name: ORACLE_NAME
        description: "Department name as defined in the legacy Oracle ERP system. Provides the human-readable label for the Oracle department code. Used in reports requiring Oracle-aligned naming."
      - name: SAP_CODE
        description: "Department code from the SAP ERP system mapped to the Oracle equivalent. Serves as the identifier for the same department in SAP-based processes. Used for system migration and cross-reference."
      - name: SAP_NAME
        description: "Department name as defined in the SAP ERP system. Provides the human-readable label for the SAP department code. Used in reports requiring SAP-aligned naming."
      - name: CREATED
        description: "Timestamp when this mapping record was created in the SharePoint list. Records the initial data entry date for audit purposes. Stored in ISO 8601 format from SharePoint."
      - name: MODIFIED
        description: "Timestamp when this mapping record was last modified in the SharePoint list. Reflects the most recent edit to the reference data. Stored in ISO 8601 format from SharePoint."
      - name: CREATEDBY
        description: "Email address of the user who created this record in the SharePoint list. Identifies the data steward responsible for initial entry. Used for data ownership and governance tracking."
      - name: MODIFIEDBY
        description: "Email address of the user who last modified this record in the SharePoint list. Identifies who made the most recent change. Used for data ownership and governance tracking."
  - name: BRONZE__TEH_SUPPORT_SERVICES__SHAREPOINT_SERVICE_BUSINESS_UNIT_MAPPING
