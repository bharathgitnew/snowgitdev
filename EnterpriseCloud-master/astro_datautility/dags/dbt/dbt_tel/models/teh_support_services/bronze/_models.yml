  - name: BRONZE__TEH_SUPPORT_SERVICES__TEACOMMON_EMPLOYEE
    description: |
      PURPOSE: Raw ingestion of employee master data from the TEA common HR system containing workforce demographics, assignments, and contact information.
      GRAIN: One row per employee identified by company and employee ID.
    tests:
      - has_data
      - recently_run
    columns:
      - name: COMPANYID
        description: "Company code identifying the legal entity in the TEL corporate structure. Values such as TEA, TEH, or SSI represent different subsidiaries. Used to partition employee and organizational data by entity."
      - name: EMPLOYEEID
        description: "Unique numeric employee identifier assigned by the HR system. Serves as the primary key for employee records across TEL systems. Used for cross-system employee resolution and reporting."
      - name: ADPCOMPANY
        description: "ADP payroll company code identifying the payroll processing entity. Maps the employee to the correct ADP payroll account. Used for payroll integration and processing."
      - name: ADP_PERSON_ID
        description: "ADP person identifier linking the employee to the ADP payroll system. Used for bi-directional synchronization between HR and payroll platforms. May be null for non-ADP processed employees."
      - name: ACTIVE
        description: "Boolean flag indicating whether the employee record is currently active. Set to true for current employees and false for terminated or inactive records. Used to filter active workforce in queries."
      - name: EMPLOYEETYPE
        description: "Numeric code classifying the type of employment arrangement. Values distinguish between regular full-time, contract, and temporary workers. Used for workforce segmentation and reporting."
      - name: FIRSTNAME
        description: "Employee's given or first name as recorded in the HR system. Used for display in user directories and communications. Sourced from the official HR master record."
      - name: LASTNAME
        description: "Employee's family or last name as recorded in the HR system. Used for display in user directories and formal communications. Sourced from the official HR master record."
      - name: NAMEUSED
        description: "Preferred name the employee uses in daily business interactions. May differ from the legal first name recorded in HR. Used for informal communications and system display names."
      - name: ADP_POSN_ID
        description: "ADP position identifier linking the employee to their position in the ADP system. References the job position record in the payroll platform. Used for position management and compensation."
      - name: JOBCODE
        description: "Numeric job classification code from the HR system. Groups similar roles under a common code for compensation and reporting purposes. Used for workforce analytics by job family."
      - name: JOBTITLE
        description: "Official job title of the employee as defined in the HR system. Describes the role and level within the organizational hierarchy. Used for organizational reporting and directory listings."
      - name: EMAIL
        description: "Corporate email address assigned to the employee. Primary electronic communication channel for business use. Follows the company domain naming convention."
      - name: SUPERVISORID
        description: "Employee ID of the direct supervisor or manager for this employee. References another record in the employee table to form the reporting hierarchy. Used to build organizational charts and approval chains."
      - name: DEPTCODE
        description: "Department code uniquely identifying an organizational unit within the company. Numeric code from the HR master data system. Used as a foreign key to resolve department names and hierarchy."
      - name: PRODLINECODE
        description: "Product line code identifying the business product group within the company. Numeric code from the organizational master data. Used to classify employees and costs by product line."
      - name: LOCATIONCODE
        description: "Location code identifying a physical site or office within the company structure. Numeric code from the facilities master data. Used to associate employees and assets with geographic locations."
      - name: STATE
        description: "State or province code where the employee is primarily located. Abbreviated geographic identifier from the HR system. Used for regional reporting and tax jurisdiction."
      - name: MAILSTOP
        description: "Internal mail stop code identifying the employee's physical mail delivery location. Used by facilities and mail room for internal document distribution. Alphanumeric code specific to each building."
      - name: OFFCPHONE
        description: "Office telephone number for the employee's desk phone. Primary landline contact for business communications. Includes area code formatting."
      - name: OFFCEXT
        description: "Office phone extension number for reaching the employee via internal PBX. Used when dialing internally without the full external number. Numeric extension code."
      - name: OFFCPAGERMODEL
        description: "Model identifier for the employee's office pager device. Legacy field from pager-based communications infrastructure. May be null for employees without pager assignments."
      - name: OFFCPAGER
        description: "Office pager number assigned to the employee. Legacy communication device number for after-hours contact. May be null for employees without pager assignments."
      - name: OFFCPIN
        description: "PIN code for the employee's office pager device. Required to send messages to the pager. Legacy field that may be null."
      - name: OFFCPAGECOVAREA
        description: "Coverage area description for the employee's office pager service. Indicates the geographic range of pager reception. Legacy field that may be null."
      - name: OFFCDISPATCH
        description: "Dispatch number for the employee's office communication routing. Used for centralized dispatching of field personnel. May be null for office-based employees."
      - name: OFFCFAX
        description: "Office fax number assigned to the employee or their department. Used for document transmission via facsimile. May be null when fax is not configured."
      - name: OFFCPAGEREMAIL
        description: "Email address associated with the employee's pager for email-to-page functionality. Allows sending messages to the pager via email gateway. Legacy field that may be null."
      - name: CUSTLOCALPAGER
        description: "Customer-facing local pager number for field service communication. Used by customers to reach field technicians in their local area. May be null for non-field roles."
      - name: CUSTLOCALPIN
        description: "PIN code for the customer-facing local pager device. Required to send messages to the customer-facing pager. Legacy field that may be null."
      - name: MOBILEPHONE
        description: "Mobile phone number for the employee from the HR system. Used as a secondary contact method for field and remote workers. May include country code formatting."
      - name: SENIORITY_DATE
        description: "Date used to calculate seniority for benefits and tenure purposes. May differ from hire date in cases of rehire or organizational transfer. Used for seniority-based reporting."
      - name: FTE
        description: "Full-time equivalent classification indicating the employee's work schedule. Values such as Full Time or Part Time describe the employment basis. Used for headcount reporting and capacity planning."
      - name: DATEHIRE
        description: "Date when the employee was hired or started employment. Recorded in the HR system as the official start date. Used for seniority calculations and tenure reporting."
      - name: DATETERM
        description: "Date when the employee's employment was terminated or ended. Null for currently active employees who have not been terminated. Used to identify former employees and calculate tenure."
      - name: SALARYEXEMPT
        description: "Code indicating the employee's salary exemption status under labor regulations. Distinguishes between exempt and non-exempt workers for overtime eligibility. Used for payroll classification."
      - name: PREFERREDLANGUAGE
        description: "Preferred communication language code for the employee. Used to determine which language to use for system notifications and correspondence. Sourced from employee profile preferences."
      - name: FLEETAUTO
        description: "Fleet automobile indicator or vehicle assignment code for the employee. Identifies employees assigned a company vehicle for field operations. May be null for non-fleet employees."
      - name: KRONOS_ACCRUAL_CODE
        description: "Kronos workforce management accrual code for time-off calculations. Determines the leave accrual rules applied to the employee. Used for time and attendance integration."
      - name: KRONOS_PAY_RULE
        description: "Kronos workforce management pay rule assignment for the employee. Defines overtime, shift differential, and pay calculation rules. Used for time and attendance processing."
      - name: KRONOS_WORK_RULE
        description: "Kronos workforce management work rule assignment for the employee. Defines scheduling constraints and work hour policies. Used for schedule compliance validation."
      - name: KRONOS_ACCESS_CODE
        description: "Kronos workforce management access code for time clock authentication. Controls which time collection devices the employee can use. Used for physical access to timekeeping systems."
      - name: KRONOS_LABOR_LEVEL
        description: "Kronos workforce management labor level assignment for cost allocation. Maps employee time to organizational cost categories. Used for labor distribution reporting."
      - name: KRONOS_PAY_CODE_DATA_ACCESS
        description: "Kronos workforce management pay code data access profile. Defines which pay codes are visible and editable for the employee. Used for role-based access in timekeeping."
      - name: KRONOS_DISPLAY_PROFILE
        description: "Kronos workforce management display profile assignment. Controls the user interface configuration for the employee in the timekeeping system. Used for personalized time entry screens."
      - name: NTDOMAIN
        description: "Windows NT domain name where the employee's network account resides. Identifies which Active Directory domain authenticates the user. Used for identity resolution across IT systems."
      - name: NTLOGIN
        description: "Windows NT login username for the employee's network account. Matches the Active Directory sAMAccountName or equivalent identifier. Used for cross-referencing IT system access records."
      - name: PROJECT
        description: "Project assignment code for the employee's current primary project. Used for project-based cost allocation and resource tracking. May be null for employees not assigned to a specific project."
      - name: LASTUPDATED
        description: "Timestamp or date of the most recent update to this employee record. Reflects when HR master data was last modified for this person. Used for incremental data synchronization."
      - name: LASTUPDATEDBY
        description: "Identifier of the user or process that last updated this employee record. Tracks who made the most recent change to the HR master data. Used for audit trail and data lineage."
      - name: MIDDLE_INITIAL
        description: "Middle initial of the employee's name from the HR system. Single character representing the middle name for formal documentation. May be null when not provided."
      - name: SUFFIX
        description: "Name suffix such as Jr, Sr, or III from the HR system. Appended to the employee's formal name for legal and official purposes. May be null when not applicable."
      - name: REHIREDATE
        description: "Date when a previously terminated employee was rehired. Null for employees who have not been rehired. Used to track employment gaps and adjusted seniority."
      - name: ISMANAGER
        description: "Boolean flag indicating whether the employee holds a people management role. Set to true for employees with direct reports in the hierarchy. Used for role-based access and org chart generation."
      - name: STATUS_CODE
        description: "HR system status code indicating the employee's current employment status. Values such as A for Active distinguish between active and various leave or separation states. Used for workforce status reporting."
      - name: HRREP
        description: "Identifier of the HR representative assigned to support this employee. Links to the HR business partner responsible for the employee's organizational unit. Used for HR case routing."
      - name: WORKGROUP
        description: "Work group classification for the employee's team or functional assignment. Groups employees by operational team beyond the formal department structure. Used for scheduling and resource allocation."
      - name: BUMGR
        description: "Business unit manager identifier for the employee's organizational placement. References the manager responsible for the business unit. Used for matrix reporting relationships."
      - name: EETYPE
        description: "Extended employee type code providing additional classification beyond EMPLOYEETYPE. Offers finer-grained distinction of worker categories. Used for detailed workforce segmentation."
      - name: WFH
        description: "Work from home indicator flag for the employee's primary work arrangement. Identifies employees whose default location is remote. Used for facilities planning and communication routing."
      - name: INACTIVE
        description: "Inactive status flag indicating whether the employee record is currently not in use. Provides an additional state beyond the ACTIVE field for soft-deactivation. Used for filtering in directory lookups."
      - name: VENDORNAME
        description: "Name of the staffing vendor or contracting firm for contingent workers. Identifies the external agency supplying the contractor. Populated only for contract and temporary employees."
      - name: JOB_FAMILY
        description: "Job family classification grouping related roles into a career track. Provides broader categorization than individual job titles. Used for career development and compensation benchmarking."
      - name: SUPERVISORY_ORG
        description: "Supervisory organization identifier from the HR system. References the formal management unit in the organizational hierarchy. Used for headcount roll-up and span of control reporting."
      - name: FUNCTION1
        description: "Functional area code classifying the employee's primary business function. Groups employees by functional discipline such as Engineering or Finance. Used for cross-functional reporting."
      - name: COSTCENTER
        description: "Cost center number for financial allocation of the employee's labor costs. References the corporate chart of accounts for expense tracking. Used for budget and variance reporting."
      - name: COCODE
        description: "Company code identifying the legal entity for financial posting purposes. Maps to the SAP or ERP company code structure. Used for inter-company cost allocation."
      - name: STDHIER
        description: "Standard hierarchy code positioning the employee in the organizational reporting structure. Numeric code representing the employee's level in the standard org tree. Used for hierarchical reporting."
      - name: OLDDEPTCODE
        description: "Previous department code prior to the most recent organizational transfer. Retained for historical tracking of department changes. Used to analyze organizational movement patterns."
      - name: OLDPRODLINECODE
        description: "Previous product line code prior to the most recent reassignment. Retained for historical tracking of product line changes. Used to analyze workforce mobility across business units."
      - name: AUDIT_LOG_ID
        description: "Identifier linking this record to the dbt invocation audit log entry. Tracks which pipeline run ingested or updated this record. Used for data lineage and troubleshooting pipeline issues."
      - name: _ROW_HASH
