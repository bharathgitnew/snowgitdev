  - name: BRONZE__TEH_SUPPORT_SERVICES__ITHD_MCA_EXTERNALCASESUBTYPE
    description: |
      PURPOSE: Raw ingestion of external case subtype reference data defining the granular classification categories for IT Help Desk cases.
      GRAIN: One row per external case subtype entity identified by the CRM system-generated GUID.
    tests:
      - has_data
      - recently_run
    columns:
      - name: _FILEDATE
      - name: _FILENAME
      - name: _UPLOADDATE
      - name: AUDIT_LOG_ID
        description: "Surrogate key generated by the ingestion pipeline to uniquely track each record load event. Links to the audit logging framework for data lineage tracing. Integer value auto-incremented per load batch."
      - name: _ROW_HASH
      - name: ID
        description: "Dynamics 365 system-generated GUID serving as the primary key for this entity record. Formatted as a 36-character hyphenated string. Uniquely identifies this row across the entire CRM instance."
      - name: SINKCREATEDON
        description: "Timestamp when this record was first written to the data lake sink during extraction. Reflects pipeline processing time rather than source system creation. Used to track data landing freshness."
      - name: SINKMODIFIEDON
        description: "Timestamp when this record was last updated in the data lake sink layer. Reflects the most recent pipeline extraction that touched this record. Used for incremental processing watermarks."
      - name: CREATEDBY
        description: "GUID referencing the systemuser who originally created this record in Dynamics 365. Stored as a 36-character lookup identifier. Joins to the systemuser entity for user attribution."
      - name: CREATEDBY_ENTITYTYPE
        description: "Logical entity name of the CREATEDBY lookup target, always resolves to systemuser. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently systemuser for this field."
      - name: CREATEDBYNAME
        description: "Display name resolved from the CREATEDBY systemuser lookup reference. Denormalized at extraction time for reporting convenience. Reflects the full name of the user who created the record."
      - name: CREATEDBYYOMINAME
        description: "Phonetic (yomi) rendering of the creating user display name for Japanese locale sorting. Populated from the systemuser entity yomi name field. Empty for non-Japanese deployments."
      - name: CREATEDON
        description: "UTC timestamp when the record was originally created in the Dynamics 365 source system. Stored with timezone offset from the source extraction process. Used for auditing and time-based record filtering."
      - name: IMPORTSEQUENCENUMBER
        description: "Sequence number assigned during data import operations into Dynamics 365. Tracks the original import batch order for records created via data migration. Null for records created through the application UI."
      - name: MCA_EXTERNALCASESUBTYPEID
        description: "Dynamics 365 GUID serving as the primary key for this external case subtype record. Uniquely identifies this classification entry across the CRM instance. Referenced by case records to categorize the specific issue subtype."
      - name: MCA_EXTERNALCASETYPE
        description: "GUID lookup referencing the parent external case type entity for this subtype. Establishes the hierarchical relationship between type and subtype classifications. Joins to the mca_externalcasetype entity."
      - name: MCA_EXTERNALCASETYPE_ENTITYTYPE
        description: "Logical entity name of the MCA_EXTERNALCASETYPE lookup target, resolves to mca_externalcasetype. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently mca_externalcasetype for this field."
      - name: MCA_EXTERNALCASETYPENAME
        description: "Display name of the parent external case type resolved from the lookup reference. Denormalized at extraction time for reporting convenience. Shows the top-level classification category label."
      - name: MCA_INTERNALCASESUBTYPE
        description: "GUID lookup referencing the mapped internal case subtype for this external classification. Links external-facing categories to internal operational taxonomies. Enables translation between customer-visible and internal routing labels."
      - name: MCA_INTERNALCASESUBTYPE_ENTITYTYPE
        description: "Logical entity name of the MCA_INTERNALCASESUBTYPE lookup target. Included by the Dataverse export framework for polymorphic lookup support. Resolves to the internal case subtype entity."
      - name: MCA_INTERNALCASESUBTYPENAME
        description: "Display name of the mapped internal case subtype resolved from the lookup reference. Denormalized at extraction time for reporting convenience. Shows the internal operational subtype label."
      - name: MCA_INTERNALCASETYPE
        description: "GUID lookup referencing the mapped internal case type for this external classification. Links external-facing top-level categories to internal operational taxonomies. Enables cross-reference between customer and operational views."
      - name: MCA_INTERNALCASETYPE_ENTITYTYPE
        description: "Logical entity name of the MCA_INTERNALCASETYPE lookup target. Included by the Dataverse export framework for polymorphic lookup support. Resolves to the internal case type entity."
      - name: MCA_INTERNALCASETYPENAME
        description: "Display name of the mapped internal case type resolved from the lookup reference. Denormalized at extraction time for reporting convenience. Shows the internal operational type label."
      - name: MCA_INTERNALQUEUE
        description: "GUID lookup referencing the internal routing queue mapped to this external subtype. Determines which support team receives cases classified under this subtype. Joins to the queue entity for routing resolution."
      - name: MCA_INTERNALQUEUE_ENTITYTYPE
        description: "Logical entity name of the MCA_INTERNALQUEUE lookup target, resolves to queue. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently queue for this field."
      - name: MCA_INTERNALQUEUENAME
        description: "Display name of the internal routing queue resolved from the lookup reference. Denormalized at extraction time for reporting convenience. Shows the destination team or queue label."
      - name: MCA_INTERNALSYSTEMCATEGORY
        description: "GUID lookup referencing the system category classification for this record. Groups related system names into broader technology domains. Joins to the mca_internalsystemcategory entity."
      - name: MCA_INTERNALSYSTEMCATEGORY_ENTITYTYPE
        description: "Logical entity name of the MCA_INTERNALSYSTEMCATEGORY lookup target. Included by the Dataverse export framework for polymorphic lookup support. Resolves to the internal system category entity."
      - name: MCA_INTERNALSYSTEMCATEGORYNAME
        description: "Display name of the system category resolved from the lookup reference. Denormalized at extraction time for reporting convenience. Shows the broader technology domain label."
      - name: MCA_INTERNALSYSTEMNAME
        description: "GUID lookup referencing the internal system name entity associated with this record. Identifies which application or platform is affected or classified. Joins to the mca_internalsystemname entity."
      - name: MCA_INTERNALSYSTEMNAME_ENTITYTYPE
        description: "Logical entity name of the MCA_INTERNALSYSTEMNAME lookup target. Included by the Dataverse export framework for polymorphic lookup support. Resolves to the internal system name entity."
      - name: MCA_INTERNALSYSTEMNAMENAME
        description: "Display name of the internal system name resolved from the lookup reference. Denormalized at extraction time for reporting convenience. Shows the application or platform label."
      - name: MCA_NAME
        description: "User-defined display name for this reference data record in the CRM interface. Serves as the primary label shown in lookup fields and views. Free-text value entered by administrators during configuration."
      - name: MODIFIEDBY
        description: "GUID referencing the systemuser who last modified this record in Dynamics 365. Stored as a 36-character lookup identifier. Joins to the systemuser entity for change attribution."
      - name: MODIFIEDBY_ENTITYTYPE
        description: "Logical entity name of the MODIFIEDBY lookup target, always resolves to systemuser. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently systemuser for this field."
      - name: MODIFIEDBYNAME
        description: "Display name resolved from the MODIFIEDBY systemuser lookup reference. Denormalized at extraction time for reporting convenience. Reflects the full name of the last user who modified the record."
      - name: MODIFIEDBYYOMINAME
        description: "Phonetic (yomi) rendering of the modifying user display name for Japanese locale sorting. Populated from the systemuser entity yomi name field. Empty for non-Japanese deployments."
      - name: MODIFIEDON
        description: "UTC timestamp of the most recent modification to this record in Dynamics 365. Updated on every field-level change including system-triggered updates. Used for incremental loading and change detection."
      - name: MODIFIEDONBEHALFBY
        description: "GUID referencing the systemuser on whose behalf the last modification was performed via delegation. Populated when a user acts as a delegate for another user. Null when no delegation was involved."
      - name: MODIFIEDONBEHALFBY_ENTITYTYPE
        description: "Logical entity name of the MODIFIEDONBEHALFBY lookup target, always resolves to systemuser. Included by the Dataverse export framework for polymorphic lookup support. Value is consistently systemuser for this field."
      - name: MODIFIEDONBEHALFBYNAME
        description: "Display name of the delegate user resolved from the MODIFIEDONBEHALFBY lookup. Denormalized at extraction time for reporting convenience. Empty when no delegation occurred."
      - name: MODIFIEDONBEHALFBYYOMINAME
        description: "Phonetic (yomi) rendering of the delegate user display name for Japanese locale sorting. Populated from the systemuser entity yomi name field. Empty when no delegation occurred."
      - name: OWNERID
        description: "GUID of the principal (user or team) that owns this record in Dynamics 365. Polymorphic lookup that can reference either systemuser or team entity. Determines row-level security access."
      - name: OWNERID_ENTITYTYPE
        description: "Logical entity name indicating whether the OWNERID references a systemuser or team. Resolves the polymorphic ownership lookup to the correct target entity. Used for proper join resolution in downstream models."
      - name: OWNERIDNAME
