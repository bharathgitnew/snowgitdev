      - name: BUSINESSUNITIDNAME
        description: "Display name of the business unit resolved from the BUSINESSUNITID lookup reference. Denormalized at extraction time for reporting convenience. Shows the organizational unit label."
      - name: CREATEDBYNAME
        description: "Display name resolved from the CREATEDBY systemuser lookup reference. Denormalized at extraction time for reporting convenience. Reflects the full name of the user who created the record."
      - name: CREATEDBYYOMINAME
        description: "Phonetic (yomi) rendering of the creating user display name for Japanese locale sorting. Populated from the systemuser entity yomi name field. Empty for non-Japanese deployments."
      - name: CREATEDON
        description: "UTC timestamp when the record was originally created in the Dynamics 365 source system. Stored with timezone offset from the source extraction process. Used for auditing and time-based record filtering."
      - name: CREATEDONBEHALFBYNAME
        description: "Display name of the delegate user resolved from the CREATEDONBEHALFBY lookup. Denormalized at extraction time for reporting convenience. Empty when no delegation occurred during record creation."
      - name: CREATEDONBEHALFBYYOMINAME
        description: "Phonetic (yomi) rendering of the delegate creator display name for Japanese locale sorting. Populated from the systemuser entity yomi name field. Empty when no delegation occurred."
      - name: DEFAULTMAILBOXNAME
        description: "Display name of the default mailbox resolved from the lookup reference. Denormalized at extraction time showing the email address or mailbox label. Used for quick identification of the queue email endpoint."
      - name: DEFAULTODBFOLDERNAME
        description: "Name of the default OneDrive for Business folder configured for this user document storage. Determines the auto-created folder for CRM document associations. Set during initial user provisioning."
      - name: DISABLEDREASON
        description: "Free-text explanation of why this user account was disabled in the CRM system. Captures the administrative reason for deactivation such as termination or role change. Empty for active user accounts."
      - name: DOMAINNAME
        description: "Fully qualified domain login name for this user in DOMAIN\\username or UPN format. Serves as the primary authentication identifier for CRM login. Synchronized from the corporate directory."
      - name: EMPLOYEEID
        description: "Employee identifier from the HR system linked to this CRM user record. Provides cross-reference between the CRM platform and workforce management systems. Format varies by organization."
      - name: ENTITYIMAGE
        description: "Binary content of the entity record thumbnail image stored in Dynamics 365. Encoded as a base64 string in the extracted data. Used for visual identification in CRM views and cards."
      - name: ENTITYIMAGE_TIMESTAMP
        description: "Bigint timestamp indicating when the entity image was last updated. Used as a cache-busting version number for image retrieval. Changes each time the image is modified."
      - name: ENTITYIMAGE_URL
        description: "Relative URL path for retrieving the entity image from the Dynamics 365 web API. Constructed by the platform for image download operations. Not a fully qualified URL without the organization base address."
      - name: ENTITYIMAGEID
        description: "GUID uniquely identifying the stored entity image blob in the CRM file storage. Used internally by the platform for image retrieval and caching. Generated when an image is first uploaded to the record."
      - name: EXCHANGERATE
        description: "Currency exchange rate at the time the record was created or last updated in the CRM. Used to convert transaction currency amounts to the base organization currency. Decimal value sourced from the CRM currency management subsystem."
      - name: FIRSTNAME
        description: "First (given) name of the contact as recorded in the CRM. Sourced from portal registration, directory sync, or manual entry. Used in display name composition and personalized communication."
      - name: FULLNAME
        description: "Computed full display name combining first, middle, and last name components. Formatted according to the organization name format settings. Used as the primary display label in the CRM interface."
      - name: GOVERNMENTID
        description: "Government-issued identification number for this contact if required by compliance or identity verification. Format varies by jurisdiction. Encrypted at rest by the platform security layer."
      - name: HOMEPHONE
        description: "Home telephone number for this user as recorded in the CRM profile. Sourced from directory synchronization or manual entry. Used for emergency contact or after-hours communication."
      - name: IDENTITYID
        description: "Internal identity service identifier linking this CRM user to the authentication platform. Used by the identity subsystem for token validation and session management. Platform-managed value not directly meaningful for reporting."
      - name: IMPORTSEQUENCENUMBER
        description: "Sequence number assigned during data import operations into Dynamics 365. Tracks the original import batch order for records created via data migration. Null for records created through the application UI."
      - name: INTERNALEMAILADDRESS
        description: "Primary internal email address for this user within the corporate mail system. Used as the default sender address for CRM-generated emails. Synchronized from Azure AD or Exchange directory."
      - name: JOBTITLE
        description: "Job title or role designation for this contact within their organization. Sourced from directory sync, portal profile, or manual entry. Used for personalization and organizational context."
      - name: LASTNAME
        description: "Last (surname) of the contact as recorded in the CRM. Sourced from portal registration, directory sync, or manual entry. Used in display name composition and alphabetical sorting."
      - name: LATESTUPDATETIME
        description: "Timestamp of the most recent synchronization update applied to this user record from external sources. Tracks when directory or HR data last refreshed the profile. Used for sync health monitoring."
      - name: MCA_CONTACTNAME
        description: "Display name resolved from the MCA_CONTACT lookup reference to the linked contact record. Denormalized at extraction time for reporting convenience. Shows the associated contact full name."
      - name: MCA_CONTACTYOMINAME
        description: "Phonetic (yomi) rendering of the linked contact display name for Japanese locale sorting. Populated from the contact entity yomi name field. Empty for non-Japanese deployments."
      - name: MCA_DEFAULTCASESQUEUENAME
        description: "Display name of the default cases queue resolved from the MCA_DEFAULTCASESQUEUE lookup. Denormalized at extraction time for reporting convenience. Shows the user default case routing destination."
      - name: MIDDLENAME
        description: "Middle name of the user as recorded in the CRM user profile. Sourced from directory synchronization or manual entry. Used in full name composition when the format includes middle names."
      - name: MOBILEALERTEMAIL
        description: "Email address configured to receive mobile alert notifications for this user. Used by the CRM mobile push notification service for urgent alerts. May differ from the primary internal email address."
      - name: MOBILEOFFLINEPROFILEIDNAME
        description: "Display name of the mobile offline profile resolved from the MOBILEOFFLINEPROFILEID lookup. Denormalized at extraction time for reporting convenience. Shows which offline data set is assigned."
      - name: MOBILEPHONE
        description: "Mobile telephone number for this contact. Used for SMS communications and mobile-first contact strategies. Sourced from portal profile, directory sync, or manual entry."
      - name: MODIFIEDBYNAME
        description: "Display name resolved from the MODIFIEDBY systemuser lookup reference. Denormalized at extraction time for reporting convenience. Reflects the full name of the last user who modified the record."
      - name: MODIFIEDBYYOMINAME
        description: "Phonetic (yomi) rendering of the modifying user display name for Japanese locale sorting. Populated from the systemuser entity yomi name field. Empty for non-Japanese deployments."
      - name: MODIFIEDON
        description: "UTC timestamp of the most recent modification to this record in Dynamics 365. Updated on every field-level change including system-triggered updates. Used for incremental loading and change detection."
      - name: MODIFIEDONBEHALFBYNAME
        description: "Display name of the delegate user resolved from the MODIFIEDONBEHALFBY lookup. Denormalized at extraction time for reporting convenience. Empty when no delegation occurred."
      - name: MODIFIEDONBEHALFBYYOMINAME
        description: "Phonetic (yomi) rendering of the delegate user display name for Japanese locale sorting. Populated from the systemuser entity yomi name field. Empty when no delegation occurred."
      - name: MSDYN_BOTAPPLICATIONID
        description: "Azure AD application ID for the bot framework registration when this user represents an automated agent. Used for bot authentication and message routing configuration. Null for human users."
      - name: MSDYN_BOTDESCRIPTION
        description: "Free-text description of the bot agent purpose and capabilities when this user represents an automated agent. Provides context for administrators configuring bot routing. Null for human users."
      - name: MSDYN_BOTENDPOINT
        description: "URL endpoint for the bot messaging service when this user represents an automated agent. Used by the Omnichannel routing system to forward conversations to the bot. Null for human users."
      - name: MSDYN_BOTHANDLE
        description: "Unique handle identifier for the bot framework registration associated with this automated agent user. Used for bot discovery and message addressing in the bot ecosystem. Null for human users."
      - name: MSDYN_BOTSECRETKEYS
        description: "Encrypted secret keys for bot framework authentication when this user represents an automated agent. Used for secure communication between the CRM and the bot service. Null for human users."
      - name: MSDYN_CAPACITY
        description: "Integer value defining the maximum concurrent work item capacity for this user in Omnichannel routing. Limits how many simultaneous conversations or cases can be assigned. Used by the assignment engine for load balancing."
      - name: MSDYN_DEFAULTPRESENCEIDUSERNAME
        description: "Display name of the default presence status resolved from the MSDYN_DEFAULTPRESENCEIDUSER lookup. Denormalized at extraction time for reporting. Shows the initial availability state label."
      - name: MSDYN_GRIDWRAPPERCONTROLFIELD
        description: "Technical configuration field for the Omnichannel agent dashboard grid control rendering. Stores JSON or XML configuration for the UI component. Platform-internal field not used for business reporting."
      - name: MSDYN_OWNINGENVIRONMENTID
        description: "GUID identifying the Dataverse environment that owns this user record in multi-environment deployments. Used for environment-scoped data isolation and routing. Typically matches the current environment ID."
      - name: NICKNAME
        description: "Informal nickname or preferred name for this contact beyond the formal name fields. Used for personalized communications in less formal contexts. Free-text value entered manually."
      - name: ORGANIZATIONID
        description: "GUID referencing the organization entity that this record belongs to in Dynamics 365. Identifies the CRM tenant in multi-tenant deployment scenarios. Constant within a single-tenant environment."
      - name: ORGANIZATIONIDNAME
        description: "Display name of the organization resolved from the ORGANIZATIONID lookup reference. Denormalized at extraction time for identification. Shows the CRM tenant display label."
      - name: OVERRIDDENCREATEDON
        description: "Original creation date preserved when a record is migrated from another system via import. Overrides the standard CREATEDON timestamp for historical accuracy. Null for records created natively in this CRM instance."
      - name: PARENTSYSTEMUSERIDNAME
        description: "Display name of the manager resolved from the PARENTSYSTEMUSERID lookup reference. Denormalized at extraction time for reporting convenience. Shows the direct manager full name."
      - name: PARENTSYSTEMUSERIDYOMINAME
        description: "Phonetic (yomi) rendering of the manager display name for Japanese locale sorting. Populated from the systemuser entity yomi name field. Empty for non-Japanese deployments."
      - name: PASSPORTHI
        description: "High-order portion of the user legacy passport authentication credential. Retained for backwards compatibility with older authentication mechanisms. Deprecated in modern Dynamics 365 deployments."
      - name: PASSPORTLO
        description: "Low-order portion of the user legacy passport authentication credential. Retained for backwards compatibility with older authentication mechanisms. Deprecated in modern Dynamics 365 deployments."
      - name: PERSONALEMAILADDRESS
        description: "Personal email address for this user outside of the corporate mail system. Used for scenarios requiring non-corporate communication channels. Entered manually by the user or administrator."
      - name: PHOTOURL
        description: "URL path for the user profile photograph stored in the CRM or directory system. Used for avatar display in the CRM interface and collaboration tools. May be a relative path requiring base URL construction."
      - name: POSITIONIDNAME
        description: "Display name of the organizational position resolved from the POSITIONID lookup reference. Denormalized at extraction time for reporting convenience. Shows the formal hierarchy position title."
      - name: PROCESSID
        description: "GUID of the business process flow instance associated with this record. Links the record to its active workflow stage progression. Null when no business process flow is applied."
      - name: QUEUEIDNAME
        description: "Display name of the personal queue resolved from the QUEUEID lookup reference. Denormalized at extraction time for reporting convenience. Shows the user personal queue label."
      - name: SALUTATION
        description: "Formal salutation prefix for this contact such as Mr., Ms., Dr., or other honorific. Used in formal correspondence templates and mail merge. Free-text value entered manually."
      - name: SHAREPOINTEMAILADDRESS
        description: "Email address used for SharePoint integration and document library notifications for this user. May differ from the primary CRM email when separate SharePoint identity mapping is configured. Used for document collaboration alerts."
      - name: SITEIDNAME
        description: "Display name of the service site resolved from the SITEID lookup reference. Denormalized at extraction time for reporting convenience. Shows the physical work location label."
      - name: SKILLS
        description: "Comma-separated or structured list of skills assigned to this user for routing and scheduling. Used by the Omnichannel assignment engine for skill-based routing decisions. Configured by administrators for competency matching."
      - name: STAGEID
        description: "GUID identifying the current stage within the active business process flow. Determines which process stage the record occupies in the workflow. Null when no business process flow is active."
      - name: SYSTEMUSERID
        description: "Dynamics 365 GUID serving as the canonical primary key for this system user record. Equivalent to the ID field following the entity schema naming convention. Used in all systemuser reference lookups across the platform."
      - name: TERRITORYIDNAME
        description: "Display name of the territory resolved from the TERRITORYID lookup reference. Denormalized at extraction time for reporting convenience. Shows the assigned service or sales territory label."
      - name: TIMEZONERULEVERSIONNUMBER
        description: "Version number of the timezone rule definition applied when converting times to local. Tracks timezone database updates for historical consistency. Integer value managed by the platform."
      - name: TITLE
        description: "Professional title or designation for this user record beyond the job title. Used for formal address and organizational directory display. Entered manually or synchronized from directory services."
      - name: TRANSACTIONCURRENCYIDNAME
        description: "Display name of the transaction currency resolved from the lookup reference. Denormalized at extraction time showing the ISO currency code or label. Used for currency-aware reporting."
      - name: TRAVERSEDPATH
        description: "Comma-separated list of stage GUIDs representing the historical path through the business process flow. Records which stages the record has passed through in sequence. Used for process analytics and stage duration reporting."
      - name: USERLICENSETYPE
        description: "Integer or string code indicating the specific Dynamics 365 license SKU assigned to this user. Determines which application modules and features are accessible. Reflects the current license entitlement allocation."
      - name: USERPUID
        description: "Passport Unique Identifier from the Microsoft identity platform for this user account. Legacy authentication correlation field from older Microsoft identity systems. Used for cross-platform identity linking."
      - name: UTCCONVERSIONTIMEZONECODE
        description: "Integer code identifying the timezone used for UTC conversion of date fields on this record. Maps to the Windows timezone registry for proper offset calculation. Set based on the creating or modifying user timezone preference."
      - name: VERSIONNUMBER
        description: "Optimistic concurrency version stamp incremented on each record update in Dynamics 365. Used by the platform to detect and prevent concurrent modification conflicts. Stored as a bigint value."
      - name: WINDOWSLIVEID
        description: "Microsoft Account (formerly Windows Live ID) associated with this user for external identity linking. Used in consumer-facing scenarios or hybrid authentication models. Null for enterprise-only deployments."
      - name: YAMMEREMAILADDRESS
        description: "Email address linked to this user Yammer (Viva Engage) enterprise social network profile. Used for social collaboration integration within the CRM platform. Null when Yammer integration is not configured."
      - name: YAMMERUSERID
        description: "Unique identifier for this user account in the Yammer (Viva Engage) social network. Used for cross-platform identity correlation with enterprise social features. Null when Yammer integration is not configured."
      - name: YOMIFIRSTNAME
        description: "Phonetic (yomi) representation of the user first name for Japanese language sorting. Populated from directory services or manual entry for Japanese locale support. Empty for non-Japanese deployments."
      - name: YOMIFULLNAME
        description: "Phonetic (yomi) representation of the user complete name for Japanese language sorting. Computed from individual yomi name components following locale formatting rules. Empty for non-Japanese deployments."
      - name: YOMILASTNAME
        description: "Phonetic (yomi) representation of the user last name for Japanese language sorting. Populated from directory services or manual entry for Japanese locale support. Empty for non-Japanese deployments."
      - name: YOMIMIDDLENAME
        description: "Phonetic (yomi) representation of the user middle name for Japanese language sorting. Populated from directory services or manual entry for Japanese locale support. Empty for non-Japanese deployments."
      - name: ISDELETE
        description: "Soft-delete indicator flag from the source replication feed. Set to true when the record has been deleted in the source CRM system. Used by incremental merge logic to handle record deletions."
