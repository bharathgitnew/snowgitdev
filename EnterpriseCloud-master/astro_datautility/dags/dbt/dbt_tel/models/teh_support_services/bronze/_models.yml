  - name: BRONZE__TEH_SUPPORT_SERVICES__TGIS_CHANGE_DETAILS
    description: |
      PURPOSE: Raw ingestion of TGIS change management workflow step detail records capturing the execution history of each work item in a change request.
      GRAIN: One row per change ticket, step number, and work number combination.
    tests:
      - has_data
      - recently_run
    columns:
      - name: ID
        description: "Surrogate primary key uniquely identifying each record in this table. Auto-incremented integer generated by the TGIS data warehouse export. Used as the main join key for related tables."
      - name: CHG_MNG_NM
        description: "Unique change management number assigned by the TGIS ITSM platform. Follows the format CHG-XXXXXXXXXX as the primary business reference. Used to track change requests through the approval and implementation workflow."
      - name: STEP_NUMBER
        description: "Sequential number identifying the workflow step within the ticket process. Defines the position in the ordered workflow step sequence. Used with WORK_NUMBER to uniquely identify a work item."
      - name: STEP_NAME_JA
        description: "Japanese name of the workflow step in the TGIS process definition. Describes the purpose of this step such as registration, approval, or implementation. Configured in the TGIS workflow template."
      - name: STEP_NAME_EN
        description: "English name of the workflow step in the TGIS process definition. Describes the purpose of this step such as registration, approval, or implementation. Configured in the TGIS workflow template."
      - name: PROGRESS_CATEGORY
        description: "Numeric code indicating the progress status of the work item. Values represent states such as not started, in progress, or completed. Used to track individual work item advancement."
      - name: PROGRESS_CATEGORY_JA
        description: "Japanese language label for the progress category field. Sourced directly from the TGIS platform's bilingual configuration. Used for Japanese-locale reporting and display."
      - name: PROGRESS_CATEGORY_EN
        description: "English language label for the progress category field. Sourced directly from the TGIS platform's bilingual configuration. Used for English-locale reporting and display."
      - name: WORK_NUMBER
        description: "Sequential number identifying a specific work item within a workflow step. Multiple work items can exist at the same step for parallel assignments. Combined with STEP_NUMBER for unique work item identification."
      - name: WORK_NAME_JA
        description: "Japanese name describing the specific work activity within the step. Provides detail about what action is being performed at this step. Configured in the TGIS workflow template."
      - name: WORK_NAME_EN
        description: "English name describing the specific work activity within the step. Provides detail about what action is being performed at this step. Configured in the TGIS workflow template."
      - name: WORK_CATEGORY_ID
        description: "Numeric identifier code for the work category classification. References a lookup table in the TGIS platform for the corresponding label. Used as a foreign key for category resolution."
      - name: WORK_CATEGORY_JA
        description: "Japanese language label for the work category field. Sourced directly from the TGIS platform's bilingual configuration. Used for Japanese-locale reporting and display."
      - name: WORK_CATEGORY_EN
        description: "English language label for the work category field. Sourced directly from the TGIS platform's bilingual configuration. Used for English-locale reporting and display."
      - name: ITGC_FLAG
        description: "Boolean flag indicating whether this work item is subject to IT General Controls audit requirements. Set to true for steps that require ITGC compliance documentation. Used for SOX and audit trail reporting."
      - name: INCHARGE_GROUP_ID
        description: "Numeric identifier of the support group currently assigned to handle the ticket. References the TGIS group master for team-level routing and workload tracking. Used to determine which team owns the ticket."
      - name: INCHARGE_GROUP_JA
        description: "Japanese language label for the incharge group field. Sourced directly from the TGIS platform's bilingual configuration. Used for Japanese-locale reporting and display."
      - name: INCHARGE_GROUP_EN
        description: "English language label for the incharge group field. Sourced directly from the TGIS platform's bilingual configuration. Used for English-locale reporting and display."
      - name: ASSIGNMENT_CATEGORY_ID
        description: "Numeric identifier code for the assignment category classification. References a lookup table in the TGIS platform for the corresponding label. Used as a foreign key for category resolution."
      - name: ASSIGNMENT_CATEGORY_JA
        description: "Japanese language label for the assignment category field. Sourced directly from the TGIS platform's bilingual configuration. Used for Japanese-locale reporting and display."
      - name: ASSIGNMENT_CATEGORY_EN
        description: "English language label for the assignment category field. Sourced directly from the TGIS platform's bilingual configuration. Used for English-locale reporting and display."
      - name: WORK_COMPLETE_FLAG
        description: "Boolean flag indicating whether the assigned work item has been completed. Set to true when the assignee marks the work as done. Used to track individual task completion within multi-step workflows."
