  - name: BRONZE__TEH_SUPPORT_SERVICES__ITHD_SYSTEMUSER
    description: |
      PURPOSE: Raw ingestion of Dynamics 365 system user records representing all users with access to the IT Help Desk CRM platform.
      GRAIN: One row per system user entity identified by the CRM system-generated GUID.
    tests:
      - has_data
      - recently_run
    columns:
      - name: _FILEDATE
      - name: _FILENAME
      - name: _UPLOADDATE
      - name: AUDIT_LOG_ID
        description: "Surrogate key generated by the ingestion pipeline to uniquely track each record load event. Links to the audit logging framework for data lineage tracing. Integer value auto-incremented per load batch."
      - name: _ROW_HASH
      - name: ID
        description: "Dynamics 365 system-generated GUID serving as the primary key for this entity record. Formatted as a 36-character hyphenated string. Uniquely identifies this row across the entire CRM instance."
      - name: SINKCREATEDON
        description: "Timestamp when this record was first written to the data lake sink during extraction. Reflects pipeline processing time rather than source system creation. Used to track data landing freshness."
      - name: SINKMODIFIEDON
        description: "Timestamp when this record was last updated in the data lake sink layer. Reflects the most recent pipeline extraction that touched this record. Used for incremental processing watermarks."
      - name: ACCESSMODE
        description: "Option set integer defining the user access licensing mode in Dynamics 365. Values distinguish between full, administrative, read, support, and non-interactive access types. Determines the feature set available to this user."
      - name: ADDRESS1_ADDRESSTYPECODE
        description: "Option set integer classifying the primary address purpose such as bill-to, ship-to, or primary. Categorizes how the address is used in business processes. Standard Dynamics 365 address type enumeration."
      - name: ADDRESS1_SHIPPINGMETHODCODE
        description: "Option set integer indicating the preferred shipping method for the primary address. Maps to carrier or delivery options configured in the organization. Used for logistics and delivery preference tracking."
      - name: ADDRESS2_ADDRESSTYPECODE
        description: "Option set integer classifying the secondary address purpose such as bill-to, ship-to, or other. Categorizes how the alternate address is used in business processes. Standard Dynamics 365 address type enumeration."
      - name: ADDRESS2_SHIPPINGMETHODCODE
        description: "Option set integer indicating the preferred shipping method for the secondary address. Maps to carrier or delivery options configured in the organization. Used for logistics and delivery preference tracking."
      - name: AZURESTATE
        description: "Option set integer representing the Azure Active Directory synchronization state for this user. Indicates whether the user account is synced, pending, or disconnected from AAD. Used for identity lifecycle management."
      - name: CALTYPE
        description: "Option set integer identifying the calendar type assigned to this user for scheduling. Determines which work schedule template governs availability. Maps to Gregorian, fiscal, or custom calendar definitions."
      - name: DELETEDSTATE
        description: "Option set integer indicating the soft-delete state of this user record in the source system. Distinguishes between active records and those pending permanent removal. Used for data lifecycle and retention processing."
      - name: EMAILROUTERACCESSAPPROVAL
        description: "Option set integer indicating the email router access approval status for this queue. Controls whether the queue is authorized to process incoming and outgoing email. Values map to pending, approved, or denied states."
      - name: INCOMINGEMAILDELIVERYMETHOD
        description: "Option set integer specifying how incoming email is delivered to this queue. Determines the protocol used (server-side sync, email router, or forward mailbox). Governs the email processing pipeline for the queue."
      - name: INVITESTATUSCODE
        description: "Option set integer tracking the invitation status for this user in the CRM platform. Indicates whether the user invitation is pending, accepted, or expired. Used for onboarding workflow tracking."
      - name: MCAWF_SHAREOPTIONSET
        description: "Custom option set integer defining the share preference configuration for this user. Controls default sharing behavior for records created by this user. Organization-specific customization field."
      - name: MSDYN_AGENTTYPE
        description: "Option set integer classifying the agent type for Omnichannel customer service routing. Distinguishes between human agents, bot agents, and blended configurations. Determines routing eligibility and capacity rules."
      - name: MSDYN_BOTPROVIDER
        description: "Option set integer identifying the bot framework provider when this user represents an automated agent. Maps to Microsoft Bot Framework, Power Virtual Agents, or third-party providers. Null for human user records."
      - name: MSDYN_USERTYPE
        description: "Option set integer classifying the user type within the Omnichannel deployment model. Distinguishes between agents, supervisors, and administrators in the contact center. Determines available features and dashboard access."
      - name: OUTGOINGEMAILDELIVERYMETHOD
        description: "Option set integer specifying how outgoing email is sent from this queue. Determines the protocol used (server-side sync, email router, or SMTP). Governs the outbound email processing pipeline."
      - name: PREFERREDADDRESSCODE
        description: "Option set integer indicating which address (primary or secondary) is the user preferred default. Controls which address auto-populates in correspondence and forms. Standard Dynamics 365 preference enumeration."
      - name: PREFERREDEMAILCODE
        description: "Option set integer indicating the user preferred email address for communications. Maps to primary, secondary, or alternate email address fields. Controls default email routing for this user."
      - name: PREFERREDPHONECODE
        description: "Option set integer indicating the user preferred phone number for contact. Maps to business, home, mobile, or other phone fields. Controls default phone display in user profile views."
      - name: DEFAULTFILTERSPOPULATED
        description: "Boolean flag indicating whether the default personal view filters have been initialized for this user. Set to true after first login when the system populates standard filter views. Used for user provisioning status tracking."
      - name: DISPLAYINSERVICEVIEWS
        description: "Boolean flag controlling whether this user appears in service scheduling and resource views. Determines visibility in the scheduling board and resource selection lists. Set to false for non-service users."
      - name: ISACTIVEDIRECTORYUSER
        description: "Boolean flag indicating whether this CRM user account is linked to an Active Directory identity. True for all standard domain-authenticated users. False for application users or non-interactive accounts."
      - name: ISDISABLED
        description: "Boolean flag indicating whether this user account has been disabled in Dynamics 365. Disabled users cannot log in but their historical records remain intact. Used for offboarding without data loss."
      - name: ISEMAILADDRESSAPPROVEDBYO365ADMIN
        description: "Boolean flag indicating whether the queue email address has been approved by an Office 365 administrator. Required for server-side synchronization with Exchange Online. Must be true before the queue can send or receive email."
      - name: ISINTEGRATIONUSER
        description: "Boolean flag marking this account as a non-interactive integration service principal. Integration users authenticate via server-to-server protocols without a UI license. Used for automated data synchronization processes."
      - name: ISLICENSED
        description: "Boolean flag indicating whether this user holds a valid Dynamics 365 license assignment. Unlicensed users cannot access the application even if the account exists. Reflects the current license allocation state."
      - name: ISSYNCWITHDIRECTORY
        description: "Boolean flag indicating whether this user record synchronizes with the corporate directory service. True when Azure AD Connect or similar tooling maintains the user profile. False for manually managed accounts."
      - name: MCAWF_FOLLOWINGEMAIL
