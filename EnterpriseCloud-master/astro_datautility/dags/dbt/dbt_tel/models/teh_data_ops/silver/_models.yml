models:
  - name: SILVER__TEH_DATA_OPS__CALENDAR_DATE
    description: |
      PURPOSE: Provides a shared calendar dimension for period-based reporting and fiscal alignment across TEH Data Ops models.
      GRAIN: One row per calendar date.
      KEY LOGIC: Copies the static calendar source and only increments dates at or above the current max date in the target. Audit fields are stamped during load.
      CAVEAT: Earlier dates are not revisited on incremental runs, so retroactive source changes to historic dates will not be backfilled automatically.
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 1
    columns:
      - name: _AUDIT_LOG_ID
      - name: _ROW_HASH
      - name: _REFRESHDATE
      - name: CALENDAR_DATE
        description: Calendar date value serving as the primary key. Standard date format. One row exists for every date in the calendar range.
