- name: SILVER__TEH_FINANCE__ORACLE_TB_PERIOD_COMPARISON
  tests:
    - has_data
    - recently_run
  description: >
    Generates a rolling two-period YTD trial balance comparison for Oracle Planning, 
    sourced from the enhanced trial balance table (ORACLE_TB_LOAD_ENHANCED).

    The model derives the current fiscal period dynamically from today's date, based on 
    an April fiscal year start (April = Period 1, March = Period 12). It automatically 
    calculates the last two closed months — the Reporting Period (current month - 1) and 
    the Comparison Period (current month - 2) .

    Two account types are handled separately:
    - Balance Sheet accounts (no Profit Center): period amount is taken directly as it 
      is already a cumulative rolling balance.
    - P&L accounts (with Profit Center): amounts are summed incrementally across periods 
      to derive the YTD figure.

    The final output presents one row per GL account per company code, with YTD figures 
    for both periods and an absolute difference column representing the movement between them.

    Fiscal year convention: 
    Apr/May.../Mar 2026 ---> FY2026 = calendar year 
    Jan/Feb/Mar 2027 --> FY2026 = calendar year - 1, 


