models:
- name: BRONZE__TEH_INFOSEC__FILE_FST_EMPLOYEE_GROUP
  description: |
    PURPOSE: Captures the latest FST employee-group mapping file used for support routing and regional manager lookups.
    GRAIN: One row per FST supervisor and employee-group mapping record.
  tests:
  - has_data
  - recently_run
  columns:
  - name: _FILENAME
    description: Source file name captured from the inbound extract. Text file name. Used for lineage and load tracing.
  - name: _FILEDATE
    description: Source file date for the snapshot row. Date or timestamp format. Used to identify the reporting cut.
  - name: _AUDIT_LOG_ID
    description: dbt run identifier captured for lineage and troubleshooting. Text identifier format. Used to link rows to a specific execution.
  - name: _ROW_HASH
    description: Deterministic row hash used to detect changes between loads. Text hash format. Not intended for business reporting.
  - name: _UPLOADDATE
    description: Source upload timestamp captured with the file landing event. Timestamp format. Used to track when the extract arrived.
  - name: FSTSUPERVISORID
    description: FST supervisor identifier from the source mapping file. Text identifier format. Used to link the group assignment back to the manager.
  - name: FSTSUPERVISORNAME
    description: FST supervisor display name from the source mapping file. Text value. Used for human-readable routing and reporting.
  - name: FSTEMPLOYEEGROUP
    description: FST employee group label from the source mapping file. Text value. Used to map employees into the right support group.
  - name: REGIONALSERVICEMANAGERID
    description: Regional service manager identifier from the source mapping file. Text identifier format. Used to resolve the regional ownership chain.
  - name: RSMFLAG
    description: Regional service manager indicator from the source mapping file. Yes/no style flag. Used to distinguish manager-level rows.
  - name: REGIONALSERVICEMANAGER
    description: Regional service manager display name from the source mapping file. Text value. Used for human-readable ownership views.
- name: BRONZE__TEH_INFOSEC__KNOWBE4_REPORTING_ACCCOUNT_RISK_SCORE_HISTORY
  description: |
    PURPOSE: Captures KnowBe4 account risk score history for phishing exposure trending.
    GRAIN: One row per risk score observation date and score value.
  tests:
  - has_data
  - recently_run
  columns:
  - name: _FILENAME
    description: Source file name captured from the inbound extract. Text file name. Used for lineage and load tracing.
  - name: _FILEDATE
    description: Source file date for the snapshot row. Date or timestamp format. Used to identify the reporting cut.
  - name: _AUDIT_LOG_ID
    description: dbt run identifier captured for lineage and troubleshooting. Text identifier format. Used to link rows to a specific execution.
  - name: _ROW_HASH
    description: Deterministic row hash used to detect changes between loads. Text hash format. Not intended for business reporting.
  - name: RISK_SCORE_DATE
    description: Date when the KnowBe4 account risk score was captured. DATE format. Used for trend analysis.
  - name: RISK_SCORE
    description: KnowBe4 account risk score. Numeric score. Higher values indicate greater phishing exposure.
- name: BRONZE__TEH_INFOSEC__KNOWBE4_REPORTING_ACCOUNT
  description: |
    PURPOSE: Captures KnowBe4 account records with admin-level subscription details for security reporting.
    GRAIN: One row per KnowBe4 account and admin user pairing in the export.
  tests:
  - has_data
  - recently_run
  columns:
  - name: _FILENAME
    description: Source file name captured from the inbound extract. Text file name. Used for lineage and load tracing.
  - name: _FILEDATE
    description: Source file date for the snapshot row. Date or timestamp format. Used to identify the reporting cut.
  - name: _AUDIT_LOG_ID
    description: dbt run identifier captured for lineage and troubleshooting. Text identifier format. Used to link rows to a specific execution.
  - name: _ROW_HASH
    description: Deterministic row hash used to detect changes between loads. Text hash format. Not intended for business reporting.
  - name: ACCOUNT_NAME
    description: KnowBe4 account name from the reporting export. Text value. Used to identify the tenant subscription.
  - name: NUMBER_OF_SEATS
    description: Licensed seat count for the KnowBe4 account. Numeric value. Used to compare subscription size.
  - name: SUBSCRIPTION_END_DATE
    description: Subscription end date for the KnowBe4 account. DATE format. Used to spot expiring licenses.
  - name: SUBSCRIPTION_LEVEL
    description: Subscription tier assigned to the KnowBe4 account. Text value. Used to distinguish license packages.
  - name: ACCOUNT_TYPE
    description: KnowBe4 account type from the reporting export. Text value. Used to separate account classifications.
  - name: ACCOUNT_DOMAINS
    description: Domain list associated with the KnowBe4 account. Text value. Used to describe protected email domains.
  - name: CURRENT_RISK_SCORE
    description: Current KnowBe4 risk score for the account. Numeric score. Higher values indicate greater phishing exposure.
  - name: EMAIL
    description: Administrator email address tied to the account. Text email format. Used to identify the account contact.
  - name: FIRST_NAME
    description: Administrator first name from the account export. Text value. Used for display and contact matching.
  - name: ID
    description: Administrator identifier from the KnowBe4 account export. Text identifier format. Used as the row-level admin key.
  - name: LAST_NAME
    description: Administrator last name from the account export. Text value. Used for display and contact matching.
- name: BRONZE__TEH_INFOSEC__KNOWBE4_REPORTING_GROUPS
  description: |
