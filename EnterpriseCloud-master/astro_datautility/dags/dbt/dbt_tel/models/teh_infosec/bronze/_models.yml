- name: BRONZE__TEH_INFOSEC__SHAREPOINT_ORACLE_DEPARTMENT
  description: |
    PURPOSE: Captures the SharePoint Oracle-to-SAP department mapping used by InfoSec reference joins.
    GRAIN: One row per Oracle and SAP department mapping entry.
  tests:
  - has_data
  - recently_run
  columns:
  - name: _FILENAME
    description: Source file name captured from the inbound extract. Text file name. Used for lineage and load tracing.
  - name: _FILEDATE
    description: Source file date for the snapshot row. Date or timestamp format. Used to identify the reporting cut.
    tests:
    - dbt_expectations.expect_row_values_to_have_recent_data:
        datepart: hours
        interval: 24
  - name: _AUDIT_LOG_ID
    description: dbt run identifier captured for lineage and troubleshooting. Text identifier format. Used to link rows to a specific execution.
  - name: _ROW_HASH
    description: Deterministic row hash used to detect changes between loads. Text hash format. Not intended for business reporting.
  - name: ORACLE_CODE
    description: Oracle department code from the SharePoint mapping file. Text code format. Used as the source-side department key.
  - name: ORACLE_NAME
    description: Oracle department name from the SharePoint mapping file. Text value. Used to show the source department label.
  - name: SAP_CODE
    description: SAP department code from the SharePoint mapping file. Text code format. Used as the target-side department key.
  - name: SAP_NAME
    description: SAP department name from the SharePoint mapping file. Text value. Used to show the mapped SAP department label.
  - name: CREATED
    description: Creation timestamp from the SharePoint mapping file. Text timestamp format. Used to trace when the mapping was added.
  - name: MODIFIED
    description: Last modified timestamp from the SharePoint mapping file. Text timestamp format. Used to show when the mapping changed.
  - name: CREATEDBY
    description: Creator email address for the mapping record. Text email format. Used for audit traceability.
  - name: MODIFIEDBY
    description: Modifier email address for the mapping record. Text email format. Used for audit traceability.
