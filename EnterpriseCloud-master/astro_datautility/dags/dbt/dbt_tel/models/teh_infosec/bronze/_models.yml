  - name: _AUDIT_LOG_ID
    description: dbt run identifier captured for lineage and troubleshooting. Text identifier format. Used to link rows to a specific execution.
  - name: _ROW_HASH
    description: Deterministic row hash used to detect changes between loads. Text hash format. Not intended for business reporting.
  - name: ID
    description: KnowBe4 group identifier from the reporting export. Text identifier format. Used as the row key.
  - name: NAME
    description: KnowBe4 group name from the reporting export. Text value. Used in reporting and user assignment views.
  - name: STATUS
    description: Current KnowBe4 group status. Status indicator. Used to distinguish active and inactive groups.
  - name: GROUP_TYPE
    description: KnowBe4 group type from the reporting export. Text value. Used to distinguish group classifications.
  - name: CURRENT_RISK_SCORE
    description: Current risk score for the group. Numeric score. Higher values indicate greater phishing exposure.
- name: BRONZE__TEH_INFOSEC__KNOWBE4_REPORTING_PHISHING_CAMPAIGNS
  description: |
    PURPOSE: Captures KnowBe4 phishing campaign records expanded by group and PST context.
    GRAIN: One row per phishing campaign, group, and PST combination.
  tests:
  - has_data
  - recently_run
  columns:
  - name: _FILENAME
    description: Source file name captured from the inbound extract. Text file name. Used for lineage and load tracing.
  - name: _FILEDATE
    description: Source file date for the snapshot row. Date or timestamp format. Used to identify the reporting cut.
  - name: _AUDIT_LOG_ID
    description: dbt run identifier captured for lineage and troubleshooting. Text identifier format. Used to link rows to a specific execution.
  - name: _ROW_HASH
    description: Deterministic row hash used to detect changes between loads. Text hash format. Not intended for business reporting.
  - name: CAMPAIGN_ID
    description: KnowBe4 phishing campaign identifier. Text identifier format. Used to group the campaign events.
  - name: NAME
    description: Phishing campaign name from the reporting export. Text value. Used in dashboard labels.
  - name: CREATE_DATE
    description: Phishing campaign creation date. DATE format. Used to place the campaign on the timeline.
  - name: DIFFICULTY_FILTER
    description: Difficulty filter applied to the campaign. Text value. Used to describe targeting rules.
  - name: FREQUENCY
    description: Campaign sending frequency. Text value. Used to describe how often the campaign runs.
  - name: HIDDEN
    description: Hidden campaign indicator. Yes/no style flag. Used to show whether the campaign is visible in standard views.
  - name: GROUP_ID
    description: Target group identifier for the campaign. Text identifier format. Used to link the campaign to a user group.
  - name: GROUP_NAME
    description: Target group name for the campaign. Text value. Used in reporting and audience analysis.
  - name: LAST_RUN
    description: Last campaign run timestamp. Timestamp format. Used to show when the latest send occurred.
  - name: LAST_PHISH_PRONE_PERCENTAGE
    description: Last recorded phish-prone percentage for the campaign audience. Percentage value. Used to compare audience susceptibility.
  - name: STATUS
    description: Current campaign status. Status indicator. Used to show whether the campaign is active, completed, or paused.
  - name: SEND_DURATION
    description: Campaign send duration. Numeric duration value. Used to measure how long delivery took.
  - name: TRACK_DURATION
    description: Campaign tracking duration. Numeric duration value. Used to measure how long follow-up tracking stayed open.
  - name: PST_ID
    description: Phishing simulation test identifier linked to the campaign. Text identifier format. Used to trace the test instance.
  - name: PST_START_DATE
    description: Phishing simulation test start date. DATE format. Used to place the test on the timeline.
  - name: PST_STATUS
    description: Status of the phishing simulation test. Status indicator. Used to show test progression.
  - name: PST_PHISH_PRONE_PERCENTAGE
    description: Phish-prone percentage recorded for the test audience. Percentage value. Used to compare susceptibility across tests.
  - name: PSTS_COUNT
    description: Count of phishing simulation tests attached to the campaign. Numeric count. Used to show campaign coverage.
- name: BRONZE__TEH_INFOSEC__KNOWBE4_REPORTING_PHISHING_SECURITY_TESTS
  description: |
    PURPOSE: Captures KnowBe4 phishing security test results with landing-page and category detail.
    GRAIN: One row per security test, category, and group combination.
  tests:
  - has_data
  - recently_run
  columns:
  - name: _FILENAME
    description: Source file name captured from the inbound extract. Text file name. Used for lineage and load tracing.
  - name: _FILEDATE
    description: Source file date for the snapshot row. Date or timestamp format. Used to identify the reporting cut.
  - name: _AUDIT_LOG_ID
    description: dbt run identifier captured for lineage and troubleshooting. Text identifier format. Used to link rows to a specific execution.
  - name: _ROW_HASH
    description: Deterministic row hash used to detect changes between loads. Text hash format. Not intended for business reporting.
  - name: CAMPAIGN_ID
    description: Campaign identifier linked to the security test. Text identifier format. Used to join the test back to the campaign.
  - name: NAME
    description: Security test name from the reporting export. Text value. Used as the display label.
  - name: STARTED_AT
    description: Test start timestamp. Timestamp format. Used to mark when the simulation began.
  - name: STATUS
    description: Current test status. Status indicator. Used to show whether the simulation is active or completed.
  - name: TEMPLATE_DIFFICULTY
    description: Template difficulty used for the test. Text value. Used to describe how hard the phish was to spot.
  - name: TEMPLATE_ID
    description: Template identifier used for the test. Text identifier format. Used to trace the message template.
  - name: TEMPLATE_NAME
    description: Template name used for the test. Text value. Used in reporting.
  - name: TEMPLATE_TYPE
    description: Template type used for the test. Text value. Used to classify the message format.
  - name: LANDING_PAGE_ID
    description: Landing page identifier used in the test. Text identifier format. Used to trace the simulated page.
  - name: LANDING_PAGE_NAME
    description: Landing page name used in the test. Text value. Used in reporting.
  - name: CATEGORY_ID
    description: Category identifier for the security test. Text identifier format. Used to group tests by category.
  - name: CATEGORY_NAME
    description: Category name for the security test. Text value. Used in security awareness reporting.
  - name: GROUP_ID
    description: Target group identifier for the test. Text identifier format. Used to link the test to the audience group.
  - name: GROUP_NAME
    description: Target group name for the test. Text value. Used in reporting and audience analysis.
  - name: PST_ID
    description: Phishing simulation test identifier. Text identifier format. Used as the test key.
  - name: PHISH_PRONE_PERCENTAGE
    description: Phish-prone percentage for the test audience. Percentage value. Used to measure susceptibility.
  - name: ATTACHMENT_OPEN_COUNT
    description: Attachment open count recorded for the test. Numeric count. Used to measure interaction with attached files.
  - name: BOUNCED_COUNT
    description: Bounced count for the test send. Numeric count. Used to show delivery failures.
  - name: CLICKED_COUNT
    description: Clicked count recorded for the test. Numeric count. Used to measure user interaction with the phishing email.
  - name: DATA_ENTERED_COUNT
    description: Data entered count recorded for the test. Numeric count. Used to measure form-submission responses.
  - name: DELIVERED_COUNT
    description: Delivered count recorded for the test. Numeric count. Used to show successful email delivery.
  - name: DURATION
    description: Test duration. Numeric duration value. Used to show how long the simulation stayed active.
  - name: MACRO_ENABLED_COUNT
    description: Macro enabled count recorded for the test. Numeric count. Used to measure macro-related responses.
  - name: OPENED_COUNT
    description: Opened count recorded for the test. Numeric count. Used to measure email opens.
  - name: QR_CODE_SCANNED_COUNT
    description: QR code scanned count recorded for the test. Numeric count. Used to measure QR-based interaction.
  - name: REPLIED_COUNT
    description: Replied count recorded for the test. Numeric count. Used to measure user replies.
  - name: REPORTED_COUNT
    description: Reported count recorded for the test. Numeric count. Used to measure user-reported phishing responses.
  - name: SCHEDULED_COUNT
    description: Scheduled count recorded for the test. Numeric count. Used to measure audience scheduling coverage.
- name: BRONZE__TEH_INFOSEC__KNOWBE4_REPORTING_PHISHING_SECURITY_TESTS_RECIPIENTS
  description: |
    PURPOSE: Captures recipient-level KnowBe4 phishing test results for user response analysis.
    GRAIN: One row per recipient interaction within a phishing test PST.
  tests:
  - has_data
  - recently_run
  columns:
  - name: _FILENAME
    description: Source file name captured from the inbound extract. Text file name. Used for lineage and load tracing.
  - name: _FILEDATE
    description: Source file date for the snapshot row. Date or timestamp format. Used to identify the reporting cut.
  - name: _AUDIT_LOG_ID
    description: dbt run identifier captured for lineage and troubleshooting. Text identifier format. Used to link rows to a specific execution.
  - name: _ROW_HASH
    description: Deterministic row hash used to detect changes between loads. Text hash format. Not intended for business reporting.
  - name: PST_ID
    description: Phishing simulation test identifier. Text identifier format. Used to connect the recipient to the test.
  - name: RECIPIENT_ID
    description: Recipient identifier from the phishing export. Text identifier format. Used as the row key.
  - name: TEMPLATE_ID
    description: Template identifier used for the recipient test. Text identifier format. Used to trace the message template.
  - name: TEMPLATE_NAME
    description: Template name used for the recipient test. Text value. Used in reporting.
  - name: TEMPLATE_TYPE
    description: Template type used for the recipient test. Text value. Used to classify the message format.
  - name: TEMPLATE_DIFFICULTY
    description: Template difficulty used for the recipient test. Text value. Used to describe how hard the phish was to spot.
  - name: SCHEDULED_AT
    description: Timestamp when the test was scheduled for the recipient. Timestamp format. Used to show intended send timing.
  - name: USER_PROVISIONING_GUID
    description: Provisioning GUID for the recipient user. GUID format. Used to link the test record to identity provisioning.
  - name: USER_ID
    description: Recipient user identifier from the export. Text identifier format. Used as the user key.
  - name: USER_FIRST_NAME
    description: Recipient first name from the test export. Text value. Used for display and matching.
  - name: USER_LAST_NAME
    description: Recipient last name from the test export. Text value. Used for display and matching.
  - name: USER_EMAIL
    description: Recipient email address from the test export. Text email format. Used to identify the user.
  - name: DELIVERED_AT
    description: Timestamp when the phishing message was delivered to the recipient. Timestamp format. Used for response timing.
  - name: OPENED_AT
    description: Timestamp when the recipient opened the phishing message. Timestamp format. Used for engagement timing.
  - name: REPORTED_AT
    description: Timestamp when the recipient reported the message. Timestamp format. Used to measure reporting speed.
  - name: BROWSER
    description: Browser used by the recipient. Text value. Used for response analysis.
  - name: BROWSER_VERSION
    description: Browser version used by the recipient. Text value. Used for response analysis.
  - name: CLICKED_AT
    description: Timestamp when the recipient clicked the phishing content. Timestamp format. Used for response timing.
  - name: IP
    description: IP address observed for the recipient response. IP address format. Used for forensic tracing.
  - name: IP_LOCATION
    description: Geographic location inferred from the IP address. Text location value. Used for response analysis.
  - name: OPERATING_SYSTEM
    description: Operating system used by the recipient. Text value. Used for response analysis.
