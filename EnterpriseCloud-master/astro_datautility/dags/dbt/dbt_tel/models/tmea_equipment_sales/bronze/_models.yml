models:
- name: BRONZE__TMEA_EQUIPMENT_SALES__CRM_FILE_ACCOUNT
  description: Business that represents a customer or potential customer. The company
    that is billed in business transactions.
  tests:
  - has_data
  - recently_run
  columns:
  - name: _FILEDATE
    description: Check the _FILEDATE column in the BRONZE.TMEA_EQUIPMENT_SALES.CRM_FILE_ACCOUNT
      table to ensure it falls within the last 24-hour interval.
    tests:
    - dbt_expectations.expect_row_values_to_have_recent_data:
        datepart: hours
        interval: 24
  - name: WEBSITEURL
    description: Type the account's website URL to get quick details about the company
      profile.
  - name: TEL_COM_SUPPRESS_TECHINICAL_ACCEPTANCE
    description: Control the conversion of Technical Acceptance to PDF in Project.
  - name: INDUSTRYCODE
    description: Select the account's primary industry for use in marketing segmentation
      and demographic analysis.
  - name: OWNINGUSER
    description: Unique identifier of the user who owns the account.
  - name: EXCHANGERATE
    description: Shows the conversion rate of the record's currency. The exchange
      rate is used to convert all money fields in the record from the local currency
      to the system's default currency.
  - name: STAGEID
    description: Shows the ID of the stage.
  - name: ADDRESS1_COUNTRY
    description: Type the country or region for the primary address.
  - name: MERGED
    description: Shows whether the account has been merged with another account.
  - name: CREDITONHOLD
    description: Select whether the credit for the account is on hold. This is a useful
      reference while addressing the invoice and accounting issues with the customer.
  - name: ADDRESS2_TELEPHONE1
    description: Type the main phone number associated with the secondary address.
  - name: ADDRESS2_LINE2
    description: Type the second line of the English address.
  - name: CREATEDON
    description: Shows the date and time when the record was created. The date and
      time are displayed in the time zone selected in Microsoft Dynamics 365 options.
  - name: SIC
    description: Type the Standard Industrial Classification (SIC) code that indicates
      the account's primary industry of business, for use in marketing segmentation
      and demographic analysis.
  - name: CREATEDBY
    description: Shows who created the record.
  - name: TELEPHONE3
    description: Type a third phone number for this account.
  - name: ONHOLDTIME
    description: Shows how long, in minutes, that the record was on hold.
  - name: MARKETCAP_BASE
    description: Shows the market capitalization converted to the system's default
      base currency.
  - name: DONOTEMAIL
    description: Select whether the account allows direct email sent from Microsoft
      Dynamics 365.
  - name: ADDRESS1_LONGITUDE
    description: Type the longitude value for the primary address for use in mapping
      and other applications.
  - name: MSDYN_TAXEXEMPTNUMBER
    description: Shows the government tax exempt number.
  - name: TIMESPENTBYMEONEMAILANDMEETINGS
    description: Total time spent for emails (read and write) and meetings by me in
      relation to account record.
  - name: ADDRESS2_PRIMARYCONTACTNAME
    description: Type the name of the main contact at the account's secondary address.
  - name: MASTERID
    description: Shows the master account that the account was merged with.
  - name: DONOTBULKPOSTALMAIL
    description: Select whether the account allows bulk postal mail sent through marketing
      campaigns or quick campaigns. If Do Not Allow is selected, the account can be
      added to marketing lists, but will be excluded from the postal mail.
  - name: LASTONHOLDTIME
    description: Contains the date and time stamp of the last on hold time.
  - name: COM_REGION
    description: account 9
  - name: OWNERID
    description: Enter the user or team who is assigned to manage the record. This
      field is updated every time the record is assigned to a different user.
  - name: OVERRIDDENCREATEDON
    description: Date and time that the record was migrated.
  - name: MSDYN_BILLINGACCOUNT
    description: Reference to an other account to be used for billing (only to be
      used if billing account differs)
  - name: ADDRESS2_TELEPHONE3
    description: Type a third phone number associated with the secondary address.
  - name: ADDRESS1_SHIPPINGMETHODCODE
    description: Select a shipping method for deliveries sent to this address.
  - name: DONOTBULKEMAIL
    description: Select whether the account allows bulk email sent through campaigns.
      If Do Not Allow is selected, the account can be added to marketing lists, but
      is excluded from email.
  - name: ADDRESS1_UPSZONE
    description: Type the UPS zone of the primary address to make sure shipping charges
      are calculated correctly and deliveries are made promptly, if shipped by UPS.
  - name: ADDRESS1_LINE3
    description: Type the third line of the Japanese address.
  - name: TEL_COM_TEAM
    description: The team to which the account belongs.
  - name: EMAILADDRESS3
    description: Type an alternate email address for the account.
  - name: MODIFIEDBYEXTERNALPARTY
    description: Shows the external party who modified the record.
  - name: AGING60
    description: For system use only.
  - name: COM_CUSTOMER_CODE_6_DIGITS
    description: account 9
  - name: PREFERREDCONTACTMETHODCODE
