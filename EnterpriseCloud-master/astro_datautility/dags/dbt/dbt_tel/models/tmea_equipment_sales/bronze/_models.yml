  - has_data
  - recently_run
  columns:
  - name: _FILEDATE
    description: Check the _FILEDATE column in the BRONZE.TMEA_EQUIPMENT_SALES.CRM_FILE_OPPORTUNITY
      table to ensure it falls within the last 24-hour interval.
    tests:
    - dbt_expectations.expect_row_values_to_have_recent_data:
        datepart: hours
        interval: 24
