# flags:
#   require_generic_test_arguments_property: false

vars:
  # global variables
  dbt_date:time_zone: 'America/Chicago'
  dbt_artifacts_exclude_all_results: true
  NullTypeValues:
    TEXT: '''NULLFIELDVALUE'''
    STRING: '''NULLFIELDVALUE'''
    DATE: CAST('19000101' AS DATE)
    TIMESTAMP: CAST('19000101' AS TIMESTAMP)
    TIMESTAMP_TZ: CAST('19000101' AS TIMESTAMP_TZ)
    TIMESTAMP_NTZ: CAST('19000101' AS TIMESTAMP_NTZ)
    TIMESTAMP_LTZ: CAST('19000101' AS TIMESTAMP_LTZ)
    CHARACTER: ''''
    CHAR: ''''
    NUMBER: -999999999999999999
    character varying: '''NULLFIELDVALUE'''
    BOOLEAN: false
    VARIANT: '''NULLFIELDVALUE'''
    FLOAT: .999999999999999
    ARRAY: '[''NULLFIELDVALUE'']'
    OBJECT: '{''NULLFIELDVALUE'': ''NULLFIELDVALUE''}'
    BINARY: TO_BINARY(HEX_ENCODE('''NULLFIELDVALUE'''), 'HEX')

