version: 2
models:
- name: COMMON__KRONOS__TIMESHEET
  description: kronos timesheet model
  columns:
  - name: SOURCESYSTEM
    description: |
      This model is built with three sources unioned together. This is a flag to trace which source was used.
      - "C" is the most common, coming from CRM / manual entries
      - "N" represents time off entries
      - "O" are entries coming from the old Kronos system
