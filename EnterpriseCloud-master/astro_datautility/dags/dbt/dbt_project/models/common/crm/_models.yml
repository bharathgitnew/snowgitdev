version: 2
models:
- name: COMMON__CRM__ACCOUNT
  description: Model CRM CRM_ACCOUNT file.
  columns:
  - name: ID
    tests:
    - dbt_expectations.expect_column_values_to_be_unique:
        config:
          alias: CRM_ACCOUNT_ID_UNIQUE
    - dbt_expectations.expect_column_values_to_not_be_null:
        config:
          alias: CRM_ACCOUNT_ID_NOTNULL
- name: COMMON__CRM__CONTRACT_SUMMARY_DETAILS
  description: Model CRM CONTRACT_SUMMARY_DETAILS file.
- name: COMMON__CRM__OPPORTUNITY
  description: Model CRM CRM_OPPORTUNITY file.
  columns:
  - name: OPPORTUNITY_ID
    tests:
    - dbt_expectations.expect_column_values_to_be_unique:
        config:
          alias: CRM_OPPORTUNITY_OPPORTUNITY_ID_UNIQUE
    - dbt_expectations.expect_column_values_to_not_be_null:
        config:
          alias: CRM_OPPORTUNITY_OPPORTUNITY_ID_NOTNULL
  - name: MODIFIEDON
    tests:
    - dbt_expectations.expect_row_values_to_have_recent_data:
        datepart: day
        interval: 1
        config:
          alias: CRM_OPPORTUNITY_MODIFIEDON
