version: 2
models:
- name: COMMON__ARIBA__INTERIM_PURCHASEORDER_HEADER
  description: Model Ariba Interim_PurchaseOrder_Header file.
  columns:
  - name: RealmName
    tests:
    - dbt_expectations.expect_column_values_to_not_be_null:
        config:
          alias: Ariba__Interim_PurchaseOrder_Header__RealmName__NotNull
    - dbt_expectations.expect_column_values_to_be_in_set:
        value_set:
        - tel-BAAN-T
        - tel-BAAN
        - tel-ECC-T
        - tel-ECC
        - tel-S4-T
        - tel-S4
        config:
          alias: Ariba__Interim_PurchaseOrder_Header__RealmName__ValidValues
  - name: PurchaseOrderIdKey
    tests:
    - dbt_expectations.expect_column_values_to_not_be_null:
        config:
          alias: Ariba__Interim_PurchaseOrder_Header__PurchaseOrderIdKey__NotNull
  - name: PurchaseOrderVersionKey
    tests:
    - dbt_expectations.expect_column_values_to_not_be_null:
        config:
          alias: Ariba__Interim_PurchaseOrder_Header__PurchaseOrderVersionKey__NotNull
  - name: LastUpdated
    tests:
    - dbt_expectations.expect_row_values_to_have_recent_data:
        datepart: day
        interval: 1
        row_condition: RealmName = 'tel-S4'
        config:
          alias: Ariba__Interim_PurchaseOrder_Header__LastUpdated__Recent
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      column_list:
      - RealmName
      - PurchaseOrderIdKey
      - PurchaseOrderVersionKey
      config:
        alias: Ariba__Interim_PurchaseOrder_Header__Primary_Key__Unique
