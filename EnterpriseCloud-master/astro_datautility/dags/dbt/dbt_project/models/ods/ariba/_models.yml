version: 2
models:
- name: ODS__ARIBA__AUDITLOG
  description: Model Ariba AuditLog file.
  columns:
  - name: FileName
    tests:
    - dbt_expectations.expect_column_values_to_not_be_null:
        config:
          alias: Ariba__AuditLog__FileName__NotNull
  - name: Realm
    tests:
    - dbt_expectations.expect_column_values_to_not_be_null:
        config:
          alias: Ariba__AuditLog__Realm__NotNull
    - dbt_expectations.expect_column_values_to_be_in_set:
        value_set:
        - tel-BAAN-T
        - tel-BAAN
        - tel-ECC-T
        - tel-ECC
        - tel-S4-T
        - tel-S4
        config:
          alias: Ariba__AuditLog__Realm__ValidValues
  - name: DocumentType
    tests:
    - dbt_expectations.expect_column_values_to_not_be_null:
        config:
          alias: Ariba__AuditLog__DocumentType__NotNull
  tests:
  - dbt_expectations.expect_compound_columns_to_be_unique:
      column_list:
      - FileName
      - Realm
      - DocumentType
      config:
        alias: Ariba__AuditLog__Primary_Key__Unique
