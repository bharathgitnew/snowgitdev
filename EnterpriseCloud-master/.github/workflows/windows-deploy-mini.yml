name: Deploy mini_orch files on box
on:
  push:
    branches:
      - qa
      - sit
      - master
    paths:
      - "mini/**"
run-name: "${{ github.workflow }} | ${{ github.event_name }} | ${{ github.ref_name }} | ${{ github.run_id }}-${{ github.run_attempt }}"
env:
  SHARE_PATH: 'f$\Shares'
jobs:
  get-diff-files:
    name: Get changed files
    runs-on: [self-hosted, windows, build3]
    environment: ${{ github.ref_name == 'sit' && 'sit' || github.ref_name == 'qa' && 'qa' || github.ref_name == 'master' && 'master' }}
    outputs:
      files_changed: ${{ steps.files.outputs.changed_files }}
      files_deleted: ${{ steps.files.outputs.deleted_files }}
      files_has_changes: ${{ steps.files.outputs.has_changes }}
      files_has_deletes: ${{ steps.files.outputs.has_deletes }}

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Get changed files
        id: files
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INPUT_BASE_REF: ${{ github.event.before }}
          INPUT_HEAD_REF: ${{ github.event.after }}
          INPUT_GRAB_ON: "mini/"
          INPUT_SQL_ONLY: "false"
        run: python .github/scripts/get_diff_files.py

  deploy-files:
    name: Deploy Files
    needs: get-diff-files
    if: needs.get-diff-files.outputs.files_has_changes == 'true' || needs.get-diff-files.outputs.files_has_deletes == 'true'
    runs-on: [self-hosted, windows, build3]
    environment: ${{ github.ref_name == 'sit' && 'sit' || github.ref_name == 'qa' && 'qa' || github.ref_name == 'master' && 'master' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Files to Windows Share
        id: deploy
        shell: pwsh
        env:
          CHANGED_FILES: ${{ needs.get-diff-files.outputs.files_changed }}
          DELETED_FILES: ${{ needs.get-diff-files.outputs.files_deleted }}
          SERVER_NAME: ${{ vars.SERVER_NAME }}
          SHARE_PATH: ${{ env.SHARE_PATH }}
        run: python .github/scripts/deploy_files.py